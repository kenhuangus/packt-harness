<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Orbital Rings / Radar Scan Arcs -->
  <circle cx="30" cy="30" r="16" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.65"/>
  <ellipse cx="30" cy="30" rx="20" ry="8" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-30 30 30)" opacity="0.8"/>
  <ellipse cx="30" cy="30" rx="20" ry="8" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(30 30 30)" opacity="0.8"/>

  <!-- Research Magnifier Lens & AI Core -->
  <circle cx="28" cy="28" r="12" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Central Glowing AI Nucleus -->
  <circle cx="28" cy="28" r="4.5" fill="url(#coreGrad)"/>
  <circle cx="26" cy="26" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Research Lens Handle -->
  <path d="M37 37 L48 48" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M37 37 L48 48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Sparkle Star -->
  <path d="M46 16 L47 20 L51 21 L47 22 L46 26 L45 22 L41 21 L45 20 Z" fill="#34d399"/>
  <circle cx="15" cy="42" r="1.5" fill="#38bdf8"/>
</svg>
