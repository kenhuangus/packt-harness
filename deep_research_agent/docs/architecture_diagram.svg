  <!-- Canvas Header -->
  <rect x="0" y="0" width="1920" height="110" fill="#111827" />
  <line x1="0" y1="110" x2="1920" y2="110" stroke="#10b981" stroke-width="3" />
  
  <text x="60" y="55" fill="#f9fafb" font-size="34" font-weight="800" letter-spacing="-0.5px">⚛️ Autonomous Deep Research Agent — System Architecture</text>
  <text x="60" y="90" fill="#9ca3af" font-size="18" font-weight="500">10-Module Harness Stack: Spec-Driven Contracts, Model Context Protocol (MCP 2.x), Multi-Agent Worktrees, &amp; TDA Verification</text>
  
  <rect x="1560" y="32" width="300" height="48" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
  <text x="1710" y="62" fill="#10b981" font-size="18" font-weight="700" text-anchor="middle">5-Gate Scorecard: 100% Certified</text>

  <!-- ==================== LAYER 1: UI & PRESENTATION ==================== -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="1800" height="150" rx="14" fill="#161e2e" stroke="#374151" stroke-width="1.5"/>
    <rect width="1800" height="40" rx="14" fill="#1f2937"/>
    <text x="30" y="27" fill="#60a5fa" font-size="16" font-weight="700">LAYER 1: USER INTERACTION &amp; DASHBOARD (Web UI 2.0)</text>
    
    <!-- Component 1.1 -->
    <rect x="30" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Research Controller</text>
    <text x="50" y="112" fill="#9ca3af" font-size="14">Objective Input, Depth Presets, 1-Click Chips</text>

    <!-- Component 1.2 -->
    <rect x="470" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Interactive SVG Research Graph</text>
    <text x="490" y="112" fill="#9ca3af" font-size="14">Live Multi-Hop Node Expansion &amp; State Links</text>

    <!-- Component 1.3 -->
    <rect x="910" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Citation &amp; Evidence Matrix</text>
    <text x="930" y="112" fill="#9ca3af" font-size="14">Confidence Badges, Primary Quotes, Domains</text>

    <!-- Component 1.4 -->
    <rect x="1350" y="55" width="420" height="75" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1370" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Dossier, Diff &amp; Scorecard Tabs</text>
    <text x="1370" y="112" fill="#9ca3af" font-size="14">Markdown Reader, Line Diffs, 5-Gate Audit</text>
  </g>

