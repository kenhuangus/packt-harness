  <g transform="translate(60, 320)" filter="url(#shadow)">
    <rect width="1800" height="150" rx="14" fill="#161e2e" stroke="#374151" stroke-width="1.5"/>
    <rect width="1800" height="40" rx="14" fill="#1f2937"/>
    <text x="30" y="27" fill="#10b981" font-size="16" font-weight="700">LAYER 2: HARNESS GOVERNANCE, CONTRACTS &amp; GUARDRAILS (Modules 1, 2, 3, 4, 5)</text>

    <!-- Component 2.1 -->
    <rect x="30" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Memory &amp; Spec Contracts</text>
    <text x="50" y="112" fill="#9ca3af" font-size="14">CLAUDE.md Invariants, SPEC.md Whitelists</text>

    <!-- Component 2.2 -->
    <rect x="470" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="490" y="85" fill="#f3f4f6" font-size="17" font-weight="700">PreToolUse Hooks &amp; AST Guard</text>
    <text x="490" y="112" fill="#9ca3af" font-size="14">Deny Dangerous CLI, Scan High-Entropy Keys</text>

    <!-- Component 2.3 -->
    <rect x="910" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Permission Escalation Gateway</text>
    <text x="930" y="112" fill="#9ca3af" font-size="14">4-Tier Matrix, HMAC Signatures in approvals.json</text>

    <!-- Component 2.4 -->
    <rect x="1350" y="55" width="420" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1370" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Token Budgeter &amp; Loop Trap</text>
    <text x="1370" y="112" fill="#9ca3af" font-size="14">20/20/50/10 Budgeting, SHA-256 Rolling Deque</text>
  </g>

