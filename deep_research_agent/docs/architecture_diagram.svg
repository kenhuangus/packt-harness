  <g transform="translate(60, 500)" filter="url(#shadow)">
    <rect width="1800" height="150" rx="14" fill="#161e2e" stroke="#374151" stroke-width="1.5"/>
    <rect width="1800" height="40" rx="14" fill="#1f2937"/>
    <text x="30" y="27" fill="#f59e0b" font-size="16" font-weight="700">LAYER 3: COMPOUND MULTI-AGENT ORCHESTRATOR &amp; 5-STEP SOP (Modules 8 &amp; 9)</text>

    <!-- Component 3.1 -->
    <rect x="30" y="55" width="330" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Planner Subagent</text>
    <text x="50" y="112" fill="#9ca3af" font-size="14">Multi-Hop Query Decomposition</text>

    <!-- Component 3.2 -->
    <rect x="390" y="55" width="330" height="75" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="410" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Crawler Subagent</text>
    <text x="410" y="112" fill="#9ca3af" font-size="14">Parallel Index Harvest &amp; Ingest</text>

    <!-- Component 3.3 -->
    <rect x="750" y="55" width="330" height="75" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="770" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Fact-Checker Subagent</text>
    <text x="770" y="112" fill="#9ca3af" font-size="14">Claim Audit &amp; Grounding Math</text>

    <!-- Component 3.4 -->
    <rect x="1110" y="55" width="330" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1130" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Synthesizer Subagent</text>
    <text x="1130" y="112" fill="#9ca3af" font-size="14">Academic Dossier Assembly</text>

    <!-- Component 3.5 -->
    <rect x="1470" y="55" width="300" height="75" rx="8" fill="#111827" stroke="#ec4899" stroke-width="1.5"/>
    <text x="1490" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Ephemeral Worktrees</text>
    <text x="1490" y="112" fill="#9ca3af" font-size="14">Git Isolation &amp; Clean Teardown</text>
  </g>

  <!-- ==================== LAYER 4: INTEGRATION & MODEL CONTEXT PROTOCOL (MCP 2.x) ==================== -->
  <g transform="translate(60, 680)" filter="url(#shadow)">
    <rect width="1800" height="150" rx="14" fill="#161e2e" stroke="#374151" stroke-width="1.5"/>
    <rect width="1800" height="40" rx="14" fill="#1f2937"/>
    <text x="30" y="27" fill="#8b5cf6" font-size="16" font-weight="700">LAYER 4: MODEL CONTEXT PROTOCOL (MCP 2.x) &amp; LIVE DATA SOURCES (Module 7)</text>

    <!-- Component 4.1 -->
    <rect x="30" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="50" y="85" fill="#f3f4f6" font-size="17" font-weight="700">MCP Research Server</text>
    <text x="50" y="112" fill="#9ca3af" font-size="14">JSON-RPC 2.0 Stdio IPC Process</text>

    <!-- Component 4.2 -->
    <rect x="470" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="490" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Live arXiv Open Science API</text>
    <text x="490" y="112" fill="#9ca3af" font-size="14">Peer-Reviewed Papers &amp; Preprints</text>

    <!-- Component 4.3 -->
    <rect x="910" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="930" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Live Wikipedia REST API</text>
    <text x="930" y="112" fill="#9ca3af" font-size="14">Real-Time Global Encyclopedia Indexes</text>

    <!-- Component 4.4 -->
    <rect x="1350" y="55" width="420" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1370" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Local Vector &amp; Cache Store</text>
    <text x="1370" y="112" fill="#9ca3af" font-size="14">Deterministic Offline Grounding &amp; Fallbacks</text>
  </g>

  <!-- ==================== LAYER 5: VERIFICATION, TDA & AUDIT SCORECARD ==================== -->
  <g transform="translate(60, 860)" filter="url(#shadow)">
    <rect width="1800" height="150" rx="14" fill="#161e2e" stroke="#374151" stroke-width="1.5"/>
    <rect width="1800" height="40" rx="14" fill="#1f2937"/>
    <text x="30" y="27" fill="#10b981" font-size="16" font-weight="700">LAYER 5: TEST RELIABILITY, TELEMETRY &amp; PRODUCTION READINESS (Modules 6 &amp; 10)</text>

    <!-- Component 5.1 -->
    <rect x="30" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Pytest TDA Reliability Loop</text>
    <text x="50" y="112" fill="#9ca3af" font-size="14">Red-Repair-Green Cycles, Anti-Regression</text>

    <!-- Component 5.2 -->
    <rect x="470" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="490" y="85" fill="#f3f4f6" font-size="17" font-weight="700">5-Gate Production Auditor</text>
    <text x="490" y="112" fill="#9ca3af" font-size="14">Memory, Hooks, Tests, MCP, Subagents</text>

    <!-- Component 5.3 -->
    <rect x="910" y="55" width="410" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Unified Diff Engine</text>
    <text x="930" y="112" fill="#9ca3af" font-size="14">Line-by-Line Markdown Mutation Review</text>

    <!-- Component 5.4 -->
    <rect x="1350" y="55" width="420" height="75" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1370" y="85" fill="#f3f4f6" font-size="17" font-weight="700">Structured Telemetry Stream</text>
    <text x="1370" y="112" fill="#9ca3af" font-size="14">events.jsonl &amp; telemetry.jsonl Audit Trail</text>
  </g>

  <!-- Connective Arrows & Flow Indicators -->
  <path d="M 960 290 L 960 320" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 960 470 L 960 500" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 960 650 L 960 680" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 960 830 L 960 860" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="6,4"/>
</svg>
