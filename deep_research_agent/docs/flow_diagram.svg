<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Canvas Header -->
  <rect x="0" y="0" width="1920" height="110" fill="#111827" />
  <line x1="0" y1="110" x2="1920" y2="110" stroke="#3b82f6" stroke-width="3" />
  
  <text x="60" y="55" fill="#f9fafb" font-size="34" font-weight="800" letter-spacing="-0.5px">🔄 Autonomous Deep Research Agent — End-to-End Execution Flow</text>
  <text x="60" y="90" fill="#9ca3af" font-size="18" font-weight="500">Deterministic 8-Stage Execution Pipeline from User Hypothesis to 5-Gate Certified Research Dossier</text>
  
  <rect x="1560" y="32" width="300" height="48" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
  <text x="1710" y="62" fill="#60a5fa" font-size="18" font-weight="700" text-anchor="middle">SOP Pipeline: 100% Deterministic</text>

  <!-- ==================== TOP ROW: STAGES 1 TO 4 ==================== -->
  
  <!-- Step 1 -->
  <g transform="translate(60, 150)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#3b82f6" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#1e3a8a"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 1: SPEC CONTRACT</text>
    
    <text x="25" y="85" fill="#93c5fd" font-size="16" font-weight="700">1. User Query &amp; Invariants</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Ingests user research objective</tspan>
      <tspan x="25" dy="24">• Formulates machine SPEC.md</tspan>
      <tspan x="25" dy="24">• Declares allowed whitelists &amp; goals</tspan>
      <tspan x="25" dy="24">• Enforces CLAUDE.md memory rules</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#10b981" font-size="14" font-family="monospace" font-weight="700">✅ INVARIANT CHECK</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">SpecVerifier.is_file_allowed()</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">Non-whitelisted mutations DENIED</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="475" y1="350" x2="515" y2="350" stroke="#3b82f6" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(520, 150)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#10b981" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#065f46"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 2: WORKTREE SANDBOX</text>
    
    <text x="25" y="85" fill="#a7f3d0" font-size="16" font-weight="700">2. Ephemeral Isolation &amp; Crawl</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Spawns ephemeral git worktree</tspan>
      <tspan x="25" dy="24">• Planner splits 4 multi-hop tracks</tspan>
      <tspan x="25" dy="24">• Invokes Crawler subagent in parallel</tspan>
      <tspan x="25" dy="24">• Zero risk to main branch repository</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#10b981" font-size="14" font-family="monospace" font-weight="700">✅ ISOLATION CHECK</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">WorktreeIsolation.add(role)</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">Path.resolve().is_relative_to()</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="935" y1="350" x2="975" y2="350" stroke="#10b981" stroke-width="5" marker-end="url(#arrowGreen)"/>

  <!-- Step 3 -->
  <g transform="translate(980, 150)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#5b21b6"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 3: MCP 2.x CRAWL</text>
    
    <text x="25" y="85" fill="#ddd6fe" font-size="16" font-weight="700">3. Live APIs &amp; Primary Sources</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• JSON-RPC 2.0 stdio IPC queries</tspan>
      <tspan x="25" dy="24">• Live Wikipedia REST search API</tspan>
      <tspan x="25" dy="24">• Live arXiv Open Science preprints</tspan>
      <tspan x="25" dy="24">• Extracts grounding quotes &amp; DOIs</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#8b5cf6" font-size="14" font-family="monospace" font-weight="700">✅ MCP TOOL DISPATCH</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">@mcp.tool query_web_index()</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">8 Primary citations harvested</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="1395" y1="350" x2="1435" y2="350" stroke="#8b5cf6" stroke-width="5"/>

  <!-- Step 4 -->
  <g transform="translate(1440, 150)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#ef4444" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#991b1b"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 4: GUARDRAILS SCAN</text>
    
    <text x="25" y="85" fill="#fca5a5" font-size="16" font-weight="700">4. PreToolUse &amp; Entropy Guard</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Intercepts dangerous CLI commands</tspan>
      <tspan x="25" dy="24">• Scans for API secrets (Shannon entropy)</tspan>
      <tspan x="25" dy="24">• AST syntax validation of code blocks</tspan>
      <tspan x="25" dy="24">• Rolling SHA-256 loop trap detection</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#ef4444" font-size="14" font-family="monospace" font-weight="700">✅ SECURITY ENFORCEMENT</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">permissionDecision: 'deny' on violation</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">Zero secrets or loop traps permitted</text>
  </g>

  <!-- Downward Arrow from Step 4 to Step 5 -->
  <line x1="1645" y1="555" x2="1645" y2="595" stroke="#ef4444" stroke-width="5"/>

  <!-- ==================== BOTTOM ROW: STAGES 8 TO 5 (RIGHT TO LEFT) ==================== -->

  <!-- Step 5 -->
  <g transform="translate(1440, 600)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#10b981" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#065f46"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 5: PYTEST TDA LOOP</text>
    
    <text x="25" y="85" fill="#a7f3d0" font-size="16" font-weight="700">5. Red-Repair-Green Testing</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Executes automated pytest test suite</tspan>
      <tspan x="25" dy="24">• Verifies citation schemas &amp; quotes</tspan>
      <tspan x="25" dy="24">• Appends anti-regression guard tests</tspan>
      <tspan x="25" dy="24">• Closes loop with 100% pass verification</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#10b981" font-size="14" font-family="monospace" font-weight="700">✅ TDA VERIFICATION</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">pytest deep_research_agent/tests -v</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">13/13 Assertions PASSED (100%)</text>
  </g>

  <!-- Arrow 5 -> 6 (Leftward) -->
  <line x1="1435" y1="800" x2="1395" y2="800" stroke="#10b981" stroke-width="5"/>

  <!-- Step 6 -->
  <g transform="translate(980, 600)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#f59e0b" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#b45309"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 6: FACT-CHECK &amp; SYNTHESIS</text>
    
    <text x="25" y="85" fill="#fde68a" font-size="16" font-weight="700">6. Multi-Agent Synthesis</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Fact-checker audits match confidence</tspan>
      <tspan x="25" dy="24">• Filters low-relevance noise &amp; tokens</tspan>
      <tspan x="25" dy="24">• Synthesizes 5 Golden Pillars dossier</tspan>
      <tspan x="25" dy="24">• Builds quantitative comparative matrix</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="700">✅ ACADEMIC SYNTHESIS</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">MultiAgentResearchTeam.run_synthesizer()</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">~17,000 chars publication dossier</text>
  </g>

  <!-- Arrow 6 -> 7 (Leftward) -->
  <line x1="975" y1="800" x2="935" y2="800" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrowAmber)"/>

  <!-- Step 7 -->
  <g transform="translate(520, 600)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#3b82f6" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#1e3a8a"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 7: UNIFIED DIFF &amp; AUDIT</text>
    
    <text x="25" y="85" fill="#93c5fd" font-size="16" font-weight="700">7. Human Review &amp; 5 Gates</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Computes line-by-line unified diff</tspan>
      <tspan x="25" dy="24">• Human inspects exact mutations</tspan>
      <tspan x="25" dy="24">• ProductionHarnessAuditor runs 5 gates</tspan>
      <tspan x="25" dy="24">• Memory, Hooks, Tests, MCP, Subagents</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#3b82f6" font-size="14" font-family="monospace" font-weight="700">✅ 5-GATE AUDIT PASSED</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">ProductionHarnessAuditor.audit_all()</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">Score: 100% (5/5 Gates Certified)</text>
  </g>

  <!-- Arrow 7 -> 8 (Leftward) -->
  <line x1="515" y1="800" x2="475" y2="800" stroke="#3b82f6" stroke-width="5"/>

  <!-- Step 8 -->
  <g transform="translate(60, 600)" filter="url(#shadowFlow)">
    <rect width="410" height="400" rx="12" fill="#161e2e" stroke="#10b981" stroke-width="2"/>
    <rect width="410" height="50" rx="12" fill="#065f46"/>
    <text x="25" y="33" fill="#ffffff" font-size="18" font-weight="800">STAGE 8: PUBLICATION &amp; UI</text>
    
    <text x="25" y="85" fill="#a7f3d0" font-size="16" font-weight="700">8. Final Output &amp; Teardown</text>
    <text x="25" y="115" fill="#d1d5db" font-size="14">
      <tspan x="25" dy="0">• Writes output/dossier.md to disk</tspan>
      <tspan x="25" dy="24">• Emits events.jsonl &amp; telemetry logs</tspan>
      <tspan x="25" dy="24">• Renders live graph &amp; dossier in UI</tspan>
      <tspan x="25" dy="24">• Cleans up ephemeral worktree branch</tspan>
    </text>
    
    <rect x="25" y="270" width="360" height="105" rx="6" fill="#111827" stroke="#374151"/>
    <text x="40" y="298" fill="#10b981" font-size="14" font-family="monospace" font-weight="700">✅ PIPELINE COMPLETE</text>
    <text x="40" y="324" fill="#9ca3af" font-size="13">WorktreeIsolation.remove()</text>
    <text x="40" y="346" fill="#9ca3af" font-size="13">Dossier Delivered &amp; Verified</text>
  </g>
</svg>
