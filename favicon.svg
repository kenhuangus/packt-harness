<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="harness-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58A6D"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#BD5D3A"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262523"/>
      <stop offset="100%" stop-color="#141413"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D97757" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#shield-grad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#D97757" stroke-width="2" stroke-opacity="0.85"/>
  
  <!-- Harness Outer Shield Structure -->
  <path d="M 15 21 C 15 14, 21 11, 32 11 C 43 11, 49 14, 49 21 L 49 35 C 49 45.5, 38 51.5, 32 53.5 C 26 51.5, 15 45.5, 15 35 Z" 
        fill="none" stroke="url(#harness-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Deterministic Control Nodes & Interlock Gate -->
  <circle cx="32" cy="22" r="4.2" fill="#FAF9F5"/>
  <path d="M 32 26.2 L 32 41 M 23 33.5 L 41 33.5" stroke="#FAF9F5" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="23" cy="33.5" r="3.2" fill="#D97757" stroke="#FAF9F5" stroke-width="1.2"/>
  <circle cx="41" cy="33.5" r="3.2" fill="#D97757" stroke="#FAF9F5" stroke-width="1.2"/>
  <circle cx="32" cy="41" r="3.2" fill="#D97757" stroke="#FAF9F5" stroke-width="1.2"/>
</svg>