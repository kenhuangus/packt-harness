-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">re</span>.search(r<span class=\"tok-str\">&quot;(sk-proj-[A-Za-z0-9_\\-]{20,}|AKIA[0-9A-Z]{16})&quot;</span>, code_content):</span></div>\n<div class=\"code-line\"><span class=\"line-num\">25</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span>, [<span class=\"tok-str\">&quot;CRITICAL: Hardcoded API secret key detected!&quot;</span>]</span></div>\n<div class=\"code-line\"><span class=\"line-num\">26</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span>, [<span class=\"tok-str\">&quot;AST syntax valid. Zero secrets.&quot;</span>]</span></div>"}, {"number": 25, "raw_lines": ["MODULE 5: Permission Gateways", "Risk-Tiered Approval Gateways & Mid-Course Q&A", "\u2022 4-Tier Risk Matrix: LOW (auto-approve reads), MEDIUM (sandboxed writes), HIGH (scanned commands), CRITICAL (approvals.json).", "\u2022 Cryptographic Escalation: Critical operations (e.g. git_push) require explicit authorization tokens.", "\u2022 Checkpoint Discussion: How does your organization gate agent permissions in CI/CD?", "\u2022 Failure Analysis: Where have un-gated agent loops caused accidental outages or data loss?", "\u2022 Lab Demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_05_break_and_qna/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_05_break_and_qna/permission_escalation_gateway.py", "code_language": "python", "highlight_lines": [5, 9, 13, 14, 15, 16, 17, 18], "code_block": "class PermissionEscalationGateway:\n    def evaluate_request(self, tool_name: str, params: dict, request_id: str) -> dict:\n        risk = self.risk_matrix.get(tool_name, \"HIGH\")\n\n        # Line 5-7: LOW risk (reads) -> Auto-approved\n        if risk == \"LOW\":\n            return {\"allowed\": True, \"content\": (self.workspace / params[\"path\"]).read_text(\"utf-8\")}\n\n        # Line 9-11: MEDIUM risk (writes) -> Logged and executed in sandbox\n        if risk == \"MEDIUM\":\n            (self.workspace / params[\"path\"]).write_text(params[\"content\"], encoding=\"utf-8\")\n            return {\"allowed\": True, \"path\": str(self.workspace / params[\"path\"])}\n\n        # Line 13-20: CRITICAL risk (git_push) -> Strictly gated by approvals.json\n        if risk == \"CRITICAL\":\n            approvals = self._approvals()  # reads approvals.json\n            if request_id not in approvals:\n                self._log({\"event\": \"ESCALATION_BLOCKED\", \"request_id\": request_id})\n                return {\"allowed\": False, \"reason\": \"missing_approval\"}\n            pending = {\"request_id\": request_id, \"approved_by\": approvals[request_id]}\n            (self.workspace / \"pending_push.json\").write_text(json.dumps(pending, indent=2), encoding=\"utf-8\")\n            return {\"allowed\": True, \"pending_push\": str(self.workspace / \"pending_push.json\")}", "raw_lines": ["Module 5 Code Lab: Permission Escalation Gateway & Ledger", "File: course_implementation/module_05_break_and_qna/permission_escalation_gateway.py", "\u2022 [Line 5] Risk Classification: Auto-approves safe read-only operations (LOW risk) without slowing down the agent.", "\u2022 [Line 9] Sandboxed Writes: Logs and permits file changes within the workspace (MEDIUM risk).", "\u2022 [Lines 14-18] Approvals Ledger: Gates critical actions (git_push) behind approvals.json tokens, writing pending_push.json artifacts."], "number": 26, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">PermissionEscalationGateway</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">evaluate_request</span>(self, tool_name: <span class=\"tok-typ\">str</span>, params: <span class=\"tok-typ\">dict</span>, request_id: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        risk = self.risk_matrix.get(tool_name, <span class=\"tok-str\">&quot;HIGH&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 5-7: LOW risk (reads) -&gt; Auto-approved</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">&quot;LOW&quot;</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;allowed&quot;</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">&quot;content&quot;</span>: (self.workspace / params[<span class=\"tok-str\">&quot;path&quot;</span>]).read_text(<span class=\"tok-str\">&quot;utf-8&quot;</span>)}</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 9-11: MEDIUM risk (writes) -&gt; Logged and executed in sandbox</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">&quot;MEDIUM&quot;</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">            (self.workspace / params[<span class=\"tok-str\">&quot;path&quot;</span>]).write_text(params[<span class=\"tok-str\">&quot;content&quot;</span>], encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;allowed&quot;</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">&quot;path&quot;</span>: <span class=\"tok-typ\">str</span>(self.workspace / params[<span class=\"tok-str\">&quot;path&quot;</span>])}</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">KEY</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 13-20: CRITICAL risk (git_push) -&gt; Strictly gated by approvals.json</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">&quot;CRITICAL&quot;</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            approvals = self._approvals()  <span class=\"tok-com\"># reads approvals.json</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">17</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> request_id <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">in</span> approvals:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">                self._log({<span class=\"tok-str\">&quot;event&quot;</span>: <span class=\"tok-str\">&quot;ESCALATION_BLOCKED&quot;</span>, <span class=\"tok-str\">&quot;request_id&quot;</span>: request_id})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\">                <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;allowed&quot;</span>: <span class=\"tok-kw\">False</span>, <span class=\"tok-str\">&quot;reason&quot;</span>: <span class=\"tok-str\">&quot;missing_approval&quot;</span>}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">20</span><span class=\"line-code\">            pending = {<span class=\"tok-str\">&quot;request_id&quot;</span>: request_id, <span class=\"tok-str\">&quot;approved_by&quot;</span>: approvals[request_id]}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">            (self.workspace / <span class=\"tok-str\">&quot;pending_push.json&quot;</span>).write_text(<span class=\"tok-typ\">json</span>.dumps(pending, indent=2), encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">22</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;allowed&quot;</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">&quot;pending_push&quot;</span>: <span class=\"tok-typ\">str</span>(self.workspace / <span class=\"tok-str\">&quot;pending_push.json&quot;</span>)}</span></div>"}, {"number": 27, "raw_lines": ["MODULE 6: Tests as Reliability Layer", "The Test-Driven Agent (TDA) Red-Repair-Green Loop", "\u2022 Grounded Execution: Replace unverified agent claims with deterministic pytest subprocess return codes.", "\u2022 Real Traceback Capture: Feed raw stdout/stderr error tracebacks directly into repair prompts without copy-paste.", "\u2022 Anti-Regression Safeguards: Automatically register discovered bugs as permanent test suite fixtures.", "\u2022 Quantitative Reliability: Track first-pass pass rate, mean repair iterations, and regression count."]}, {"number": 28, "raw_lines": ["Test Tiers", "\u2022 Unit: one function", "\u2022 Integration: module boundaries", "\u2022 E2E: the whole flow"]}, {"number": 29, "raw_lines": ["Pytest Capture vs. Observability Platforms", "Dual-Loop Architecture: Black-Box Verification & Glass-Box Tracing", "\u2022 Local vs. Distributed Observability: Pytest Capture (capfd) is a local test runner ('Black Box' Outer Loop), while Langfuse, LangSmith, and Arize are distributed observability platforms ('Glass Box / X-Ray' Inner Loop).", "| Feature | Pytest Capture (capfd) | Langfuse / LangSmith / Arize | OpenAI SDK Tracing |", "| --- | --- | --- | --- |", "| Primary Role | Test Runner & Output Verifier | LLM Observability & Debugging | Raw API Logging |", "| What it Captures | Local stdout / stderr & exit codes | Full trace of prompts, tool calls, costs | Raw HTTP request / response payloads |", "| Visibility | Black Box (Final artifacts & side effects) | Glass Box (Internal reasoning & retries) | Network Level (Payloads only) |", "| Best Use Case | CI/CD Pass/Fail: Customer Acceptance | Root-Cause Debugging & Cost Tracking | Low-level connection debugging |", "\u2022 The Dual-Loop Pattern in Production:", "  \u2022 Outer Loop (Pytest): Asserts final deliverables \u2014 Did the agent create valid files? Did tests exit 0? Did stderr stay clean?", "  \u2022 Inner Loop (LangSmith / Langfuse): Diagnoses execution path \u2014 Why 3 retries? Did it hallucinate tools? What was the token cost?", "\u2022 Best Practice: Start with zero-setup Pytest Capture for deterministic correctness; add Langfuse/LangSmith later to optimize costs and reasoning."]}, {"number": 30, "raw_lines": ["Anti-Regression", "Keep the Bug", "\u2022 Every failure becomes a test", "\u2022 Append it to the suite", "\u2022 Rerun before you ship", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_06_tests_as_reliability_layer/README.md"]}, {"number": 31, "raw_lines": ["Evaluation Harnesses for Agentic AI", "The Hardest Frontier in AI Engineering", "\u2022 The Hardest Engineering Challenge: Evaluating autonomous agents (especially coding agents) is notoriously difficult due to non-deterministic multi-turn trajectories, dynamic state explosion, and test contamination.", "\u2022 Strict Evaluation Isolation: the evaluator must run in an external, independent control sandbox completely out of the agent's context and reach.", "\u2022 Industry Benchmark Examples:", "  \u2022 SWE-bench (Verified / Lite): Real-world GitHub issues evaluated against hidden unit test assertions.", "  \u2022 HumanEval & MBPP: Function-level code synthesis and unit-test benchmarks.", "  \u2022 TerminalBench & InterCode: Multi-turn interactive bash shell and CLI execution tasks.", "  \u2022 In-Repo Deterministic Replay Suites: Scored on test pass rate, scope fidelity, token spend, and permission denies."]}, {"slide_type": "code", "code_filename": "course_implementation/module_06_tests_as_reliability_layer/tda_reliability_pipeline.py", "code_language": "python", "highlight_lines": [4, 5, 6, 12, 13, 18, 19, 20], "code_block": "class TDAReliabilityPipeline:\n    def run_test_suite(self, code_under_test: str) -> dict:\n        self.code_file.write_text(code_under_test, encoding=\"utf-8\")\n        # Line 4-9: Real pytest subprocess with isolated environment\n        result = subprocess.run(\n            [sys.executable, \"-m\", \"pytest\", self.test_file.name, \"-q\", \"--tb=short\", \"-p\", \"no:cacheprovider\"],\n            cwd=self.scratch_dir, capture_output=True, text=True, encoding=\"utf-8\",\n            env={**os.environ, \"PYTHONDONTWRITEBYTECODE\": \"1\"}\n        )\n        output = result.stdout + (result.stderr or \"\")\n        # Line 12-14: Non-zero exit code captures traceback for prompt feedback\n        if result.returncode != 0:\n            return {\"passed\": False, \"traceback\": output, \"returncode\": result.returncode}\n        return {\"passed\": True, \"summary\": self._summary_line(output)}\n\n    def register_anti_regression_test(self, bug_name: str, test_code: str) -> dict:\n        # Line 18-20: Discovered bugs permanently append to test suite\n        with self.test_file.open(\"a\", encoding=\"utf-8\") as handle:\n            handle.write(f\"\\n\\n{test_code.rstrip()}\\n\")\n        return self.run_test_suite(self.code_file.read_text(encoding=\"utf-8\"))", "raw_lines": ["Module 6 Code Lab: TDA Pytest Subprocess & Anti-Regression Suite", "File: course_implementation/module_06_tests_as_reliability_layer/tda_reliability_pipeline.py", "\u2022 [Lines 4-6] Real Pytest Subprocess: Replaces unverified agent claims with deterministic subprocess exit codes.", "\u2022 [Lines 12-13] Traceback Capture: Captures raw failure output (ZeroDivisionError) directly into the agent repair prompt.", "\u2022 [Lines 18-20] Anti-Regression Safeguard: Automatically appends new bug regression tests to prevent \"fix-and-break\" cycles."], "number": 32, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">TDAReliabilityPipeline</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_test_suite</span>(self, code_under_test: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        self.code_file.write_text(code_under_test, encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 4-9: Real pytest subprocess with isolated environment</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        result = <span class=\"tok-typ\">subprocess</span>.run(</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            [<span class=\"tok-typ\">sys</span>.executable, <span class=\"tok-str\">&quot;-m&quot;</span>, <span class=\"tok-str\">&quot;pytest&quot;</span>, self.test_file.name, <span class=\"tok-str\">&quot;-q&quot;</span>, <span class=\"tok-str\">&quot;--tb=short&quot;</span>, <span class=\"tok-str\">&quot;-p&quot;</span>, <span class=\"tok-str\">&quot;no:cacheprovider&quot;</span>],</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            cwd=self.scratch_dir, capture_output=<span class=\"tok-kw\">True</span>, text=<span class=\"tok-kw\">True</span>, encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">            env={**<span class=\"tok-typ\">os</span>.environ, <span class=\"tok-str\">&quot;PYTHONDONTWRITEBYTECODE&quot;</span>: <span class=\"tok-str\">&quot;1&quot;</span>}</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        output = result.stdout + (result.stderr <span class=\"tok-kw\">or</span> <span class=\"tok-str\">&quot;&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 12-14: Non-zero exit code captures traceback for prompt feedback</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> result.returncode != 0:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;passed&quot;</span>: <span class=\"tok-kw\">False</span>, <span class=\"tok-str\">&quot;traceback&quot;</span>: output, <span class=\"tok-str\">&quot;returncode&quot;</span>: result.returncode}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">&quot;passed&quot;</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">&quot;summary&quot;</span>: self._summary_line(output)}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">register_anti_regression_test</span>(self, bug_name: <span class=\"tok-typ\">str</span>, test_code: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 18-20: Discovered bugs permanently append to test suite</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">with</span> self.test_file.open(<span class=\"tok-str\">&quot;a&quot;</span>, encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>) <span class=\"tok-kw\">as</span> handle:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">19</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            handle.write(f<span class=\"tok-str\">&quot;\\n\\n{test_code.rstrip()}\\n&quot;</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">20</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> self.run_test_suite(self.code_file.read_text(encoding=<span class=\"tok-str\">&quot;utf-8&quot;</span>))</span></div>"}, {"number": 33, "raw_lines": ["MODULE 7: Agent Extensions with Skills, Plugins, MCP etc.", "Extending Agent Capabilities via SOPs, Tool Servers & Distribution Bundles", "\u2022 Modular Architecture: Decouples domain knowledge (Skills), executable tool servers (MCP), and distribution packages (Plugins).", "\u2022 Skills (SKILL.md): Standardized Markdown SOPs loaded on demand via progressive disclosure.", "\u2022 Plugins (.claude-plugin/plugin.json): Self-contained bundles packaging skills, hooks, MCP servers, and subagents.", "\u2022 Model Context Protocol (MCP): Open standard exposing deterministic tools (@mcp.tool) and resources over stdio and Streamable HTTP.", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_07_skills_plugins_mcp/README.md"]}, {"number": 34, "raw_lines": ["Agent Skills & Directory Layout", "Standard Architecture: SKILL.md, Scripts & References", "\u2022 Self-Contained Modularity: Encapsulates domain expertise, execution scripts, and API schemas in one directory.", "\u2022 SKILL.md Entry Point: YAML frontmatter with description defining what the skill does and when to use it.", "\u2022 Progressive Disclosure: Heavy scripts/ and references/ are only loaded into context when triggered.", "\u2022 Precedence Hierarchy (Highest to Lowest): 1. Enterprise Managed > 2. Personal User-Level (~/.claude/skills/) > 3. Project Root (.claude/skills/).", "\u2022 OWASP Agentic Skill Top 10 Risks: https://owasp.org/www-project-agentic-skills-top-10/ (Standardized security taxonomy covering prompt injection in instructions, malicious tool schemas, unauthorized data egress, and unvalidated script execution in agent skills).", "\u2022 Video Walkthrough: https://www.youtube.com/watch?v=l-uwnCzRRE0 (In-depth breakdown of OWASP Agentic Skills Top 10 risks & defenses)."]}, {"number": 35, "raw_lines": ["Plugin Architecture: plugin.json vs. marketplace.json", "Local Implementation Blueprint vs. Global Distribution Registry", "\u2022 plugin.json (Internal Blueprint): Resides locally at .claude-plugin/plugin.json. Maps plugin identity (e.g., \"name\": \"db-helper\", \"version\": \"1.0.0\"), execution boundaries, language runtimes, companion agents, hooks, and MCP servers so the Claude client can register and isolate that specific tool on your machine.", "\u2022 marketplace.json (Public Registry): Operates as the ecosystem distribution catalog. Acts as an index pointing to secure hosting locations, verified developer profiles, version histories, and download URLs (e.g., listing db-helper with author & compatibility requirements) so users can safely discover and install plugins.", "\u2022 Strict Operational Hierarchy: While plugin.json configures how a single tool functions under the hood locally, marketplace.json manages how users discover, download, and safely install that tool from an approved repository or enterprise store."]}, {"number": 36, "raw_lines": ["Model Context Protocol (MCP): Architecture & Protocol Evolution", "Host, Client, Server, Tools & Modern Stateless JSON-RPC 2.0", "\u2022 4 Core MCP Architecture Roles:", "  \u2022 MCP Host: Overarching runtime environment (Claude Code, Cursor) managing the chat session & coordinating external endpoints without application bloat.", "  \u2022 MCP Client: Nested 1-to-1 connection manager handling feature discovery, authentication, intent-to-call translation, and output formatting.", "  \u2022 MCP Server: Independent service abstracting databases (Postgres), APIs (GitHub), or filesystems locally or remotely.", "  \u2022 MCP Tools, Resources & Prompts: Actionable capabilities (@mcp.tool decorators with JSON Schema), raw readable data URIs, and reusable prompt templates.", "\u2022 Protocol Architecture & Evolution (Stateless JSON-RPC 2.0):", "  \u2022 Fully Stateless Requests: Protocol shifted from legacy stateful sessions to a stateless request-response model using JSON-RPC 2.0 (initialization handshake and sticky session routing removed).", "  \u2022 Universal Serverless Scaling: Self-contained requests allow servers to scale behind standard load balancers on AWS Lambda or Cloudflare Workers.", "  \u2022 Multi-Round Trip Requests (MRTR): Human input or extra authorization returns resultType: \"input_required\", allowing client retries to land on any server instance seamlessly.", "  \u2022 Flexible Transports: stdio for low-overhead local plugins; standardized HTTP/HTTPS for remote cloud infrastructure."]}, {"number": 37, "raw_lines": ["Securing the Model Context Protocol (MCP) Server", "Threat Modeling, 3-Zone Architecture & Production Hardening Checklist", "\u2022 Reference: Ken Huang \u2014 \"Securing the Model Context Protocol (MCP) Server\" (https://kenhuangus.substack.com/p/securing-the-model-context-protocol)", "\u2022 3-Zone Defense-in-Depth Architecture:", "  \u2022 Zone 0 (Control Plane): Vault dynamic secrets (PKI, 5-min TTL), Policy-as-Code engine (OPA/Cedar), and OTEL SIEM audit bus.", "  \u2022 Zone 1 (MCP Server Fleet): Stateless pods behind mTLS mesh, read-only rootfs, no service account automount, and sidecar OPA authz.", "  \u2022 Zone 2 (Tool Runtime): Firecracker micro-VMs / gVisor sandboxes per tool invocation, strict FQDN egress allowlists, and dropped capabilities (drop=ALL).", "  \u2022 Zone 3 (Downstream APIs): Scoped, audience-restricted tokens for SaaS, databases, and Kubernetes clusters.", "\u2022 9-Point MCP Hardening Checklist:", "  \u2022 1. Transport & Auth: TLS 1.3 AES-256-GCM, mTLS with SPIFFE IDs or DPoP-bound JWTs (audience-locked to prevent cross-audience replay).", "  \u2022 2. Authorization (Policy-as-Code): Default-deny OPA/Cedar evaluating subject, action, resource, and context (no wildcard tools.*).", "  \u2022 3. Strict Input Validation: JSON Schema strict mode (no additionalProperties), max string length 8 kB, array length 1,000, max depth 15.", "  \u2022 4. Output Sanitization & Secret Stripping: Streaming regex filter strips AWS keys (AKIA), OpenAI keys, GCP tokens, and PANs before LLM context re-entry.", "  \u2022 5. Secrets Lifecycle: Dynamic Vault leases (15-min DB roles, 60-min AWS STS); never inject static root credentials into tool containers.", "  \u2022 6. Sandboxed Execution: Micro-VMs (gVisor/Firecracker), readOnlyRootFilesystem=true, seccomp=RuntimeDefault, 50% RAM tmpfs scratch.", "  \u2022 7. Rate Limiting & Denial-of-Wallet Guards: Token buckets (100 req/min), declared $maxCost USD quotas per tool, global circuit-breakers.", "  \u2022 8. Supply-Chain Security: Pin and hash dependencies (--hash=sha256:), private PyPI mirror, Sigstore Cosign image signing & SBOM.", "  \u2022 9. Human-in-the-Loop Gateways: Destructive or high-cost actions (> $50 or DROP/DELETE) require step-up FIDO2 / mobile MFA approval.", "\u2022 Insecure MCP Demo: https://github.com/kenhuangus/mcp-vulnerable-server-demo (Hands-on exploration of prompt injection, SSRF & command execution vulnerabilities in MCP servers)"]}, {"number": 38, "raw_lines": ["Comparing Agent Extension Mechanisms: MCP vs. CLI vs. Skill vs. Plugin vs. Hook", "Taxonomy, Simple Definitions & Operational Boundaries", "| Concept | Simple Definition | Who or What Uses It? |", "|---|---|---|", "| MCP | A universal bridge connecting AI models to data and tools. | AI Models |", "| CLI | A text-based interface to run commands on a computer. | Humans or Scripts |", "| Skill | A pre-packaged set of instructions that teaches an AI a new capability. | AI Platforms |", "| Plug-in | An add-on that adds a specific feature to a software program. | Host Applications |", "| Hook | A code trigger that automatically runs when a specific event happens. | Software Runtimes |", "\u2022 MCP vs. CLI: MCP provides structured, typed JSON-RPC schema calls directly to AI models; CLI provides text-based command execution for developers and automation scripts.", "\u2022 Skill vs. Plugin: Skills package in-context procedural knowledge and domain scripts (SKILL.md); Plugins package tools, configurations, and skills into installable add-ons (plugin.json).", "\u2022 Hook vs. Tool: Tools are actively called by the AI to mutate state; Hooks are deterministic event triggers executed automatically by the runtime to enforce safety guardrails."]}, {"number": 39, "raw_lines": ["Multi-Agent Design Patterns & Production Hardening Framework", "The 7 Core Architectural Topologies, Execution Flows & Production Hardening Checklist", "\u2022 The 7 Production Multi-Agent Topologies (Ordered from Simplest to Most Complex):", "  \u2022 1. Orchestrator\u2013Worker: Central controller decomposes incoming tasks and dynamically delegates to specialized worker agents (search, code, write) with fallback routing.", "  \u2022 2. Pipeline (Sequential Chain): Strictly ordered linear stages (Plan \u2794 Research \u2794 Draft \u2794 Format) with stage-level auditing and checkpointing.", "  \u2022 3. Fan-out / Fan-in (Map\u2013Reduce): Dispatcher spawns N parallel workers over independent chunks; Reducer merges results with strict concurrency caps.", "  \u2022 4. Critic\u2013Refiner (Self-Improvement Loop): Generator produces output, Critic evaluates against rubric/tests, Refiner improves with a hard iteration cap (2-3 rounds).", "  \u2022 5. Hierarchical (Multi-Tier): Root orchestrator delegates to domain sub-managers (engineering, ops) with per-tier timeouts and cancellation propagation.", "  \u2022 6. Event-Driven (Reactive): Agents subscribe to message bus topics, reacting asynchronously with decoupled scaling, distributed tracing, and idempotent event handlers.", "  \u2022 7. Sidecar + Human Escalation: Guard agent intercepts mutating actions (DB/API/files), routing high-risk operations to human reviewers.", "\u2022 4-Pillar Production Hardening Checklist (Universal Across All Patterns):", "  \u2022 Observability: Distributed trace spans per agent invocation, token cost attribution per request, error rate dashboards, and p50/p95/p99 latency percentiles.", "  \u2022 Reliability: Circuit breakers with exponential backoff, per-agent timeout budgets, idempotent write handlers, and state checkpointing.", "  \u2022 Security & Governance: Intent-Based Access Control (IBAC), least-privilege tool isolation, immutable audit logs with hashes, and global kill switch propagation.", "  \u2022 Context Management: Shared context bus / memory (avoids prompt bloating), RAG grounding in authoritative sources, and strict context window budget enforcement."]}, {"slide_type": "code", "code_filename": "course_implementation/module_07_skills_plugins_mcp/mcp_server_demo.py & mcp_client_runner.py", "code_language": "python", "highlight_lines": [5, 6, 9, 10, 18, 19, 20, 21], "code_block": "# MCP Server 2.x SDK (mcp_server_demo.py)\nfrom mcp.server.mcpserver import MCPServer\nmcp = MCPServer(\"Harness-Enterprise-Tools\")\n\n# Line 5-7: Callable tool with arguments and execution side-effects\n@mcp.tool()\ndef query_database_record(record_id: int) -> str:\n    return f\"DB_RECORD #{record_id}: status=ACTIVE, owner=admin, env=production\"\n\n# Line 9-11: Read-only resource URI schema\n@mcp.resource(\"config://app-settings\")\ndef app_settings() -> str:\n    return json.dumps({\"application\": \"harness-enterprise\", \"record_access\": \"read-only\"})\n\n# Client Session Runner (mcp_client_runner.py)\nserver_params = StdioServerParameters(command=sys.executable, args=[\"mcp_server_demo.py\"])\nasync with stdio_client(server_params) as (read_stream, write_stream):\n    async with ClientSession(read_stream, write_stream) as session:\n        # Line 18-21: Handshake, dynamic discovery & execution over stdio\n        await session.initialize()\n        tools = await session.list_tools()\n        result = await session.call_tool(\"query_database_record\", arguments={\"record_id\": 4092})\n        resource = await session.read_resource(\"config://app-settings\")", "raw_lines": ["Module 7 Code Lab: MCP Server & Async Client stdio Protocol", "File: course_implementation/module_07_skills_plugins_mcp/mcp_server_demo.py & mcp_client_runner.py", "\u2022 [Line 5] @mcp.tool Decorator: Defines callable actions with parameters and execution capabilities.", "\u2022 [Line 9] @mcp.resource Decorator: Exposes read-only application state over standard URIs (config://).", "\u2022 [Lines 18-21] ClientSession stdio Protocol: Performs protocol handshake, capability discovery, and typed tool calls.", "\u2022 Insecure MCP Demo: https://github.com/kenhuangus/mcp-vulnerable-server-demo (Hands-on exploration of prompt injection, unauthenticated SSE, SSRF & command execution in vulnerable MCP servers)."], "number": 40, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-com\"># MCP Server 2.x SDK (mcp_server_demo.py)</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\"><span class=\"tok-kw\">from</span> mcp.server.mcpserver <span class=\"tok-kw\">import</span> <span class=\"tok-typ\">MCPServer</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">mcp = <span class=\"tok-typ\">MCPServer</span>(<span class=\"tok-str\">&quot;Harness-Enterprise-Tools&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\"><span class=\"tok-com\"># Line 5-7: Callable tool with arguments and execution side-effects</span></span></div>\n<di iv class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\"><span class=\"tok-com\"># Client Session Runner (mcp_client_runner.py)</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">server_params = <span class=\"tok-typ\">StdioServerParameters</span>(command=<span class=\"tok-typ\">sys</span>.executable, args=[<span class=\"tok-str\">&quot;mcp_server_demo.py&quot;</span>])</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\"><span class=\"tok-kw\">async</span> <span class=\"tok-kw\">with</span> stdio_client(server_params) <span class=\"tok-kw\">as</span> (read_stream, write_stream):</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    <span class=\"tok-kw\">async</span> <span class=\"tok-kw\">with</span> <span class=\"tok-typ\">ClientSession</span>(read_stream, write_stream) <span class=\"tok-kw\">as</span> session:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">19</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 18-21: Handshake, dynamic discovery &amp; execution over stdio</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">20</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">await</span> session.initialize()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">21</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        tools = <span class=\"tok-kw\">await</span> session.list_tools()</span></div>\n<div class=\"code-line\"><span class=\"line-num\">22</span><span class=\"line-code\">        result = <span class=\"tok-kw\">await</span> session.call_tool(<span class=\"tok-str\">&quot;query_database_record&quot;</span>, arguments={<span class=\"tok-str\">&quot;record_id&quot;</span>: 4092})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">23</span><span class=\"line-code\">        resource = <span class=\"tok-kw\">await</span> session.read_resource(<span class=\"tok-str\">&quot;config://app-settings&quot;</span>)</span></div>"}, {"number": 41, "raw_lines": ["MODULE 8: Compound Engineering", "Why Multi-Agent Roles & Context Isolation", "\u2022 Cognitive Overload: A single un-scoped agent drowns in fat context and degraded reasoning.", "\u2022 Specialization: Divide execution into Planner (architect), Implementer (coder), and Reviewer (auditor).", "\u2022 Git Worktree Isolation: Ephemeral isolation: worktree branches prevent implementer edits from dirtying main.", "\u2022 Sub-Spec Extraction: Deliver lean, slice-specific prompt contexts to subagents for maximum efficiency.", "\u2022 Compounding Loop: telemetry.jsonl feeds lessons and failure patterns into AGENTS.md for continuous improvement.", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_08_compound_engineering/README.md"]}, {"raw_lines": ["Compound Orchestrator", "The Compounding Agent Loop", "\u2022 Open-source framework: https://github.com/kenhuangus/compound-orchestrator", "\u2022 Core Loop: brainstorm -> plan -> 6 contracts -> 2-round review -> work -> compound", "\u2022 Durable Learning: Every task logs reusable decisions, failure notes, and compound notes", "\u2022 Cross-runtime: First-class Claude Code & Codex support; portable across Windows, macOS, Linux", "\u2022 Skill for this Plug-in: https://github.com/kenhuangus/compound-orchestrator/blob/main/skills/compound-orchestrator/SKILL.md"], "number": 42}, {"raw_lines": ["Six Planning Contracts", "Machine & Human Alignment", "\u2022 6 Standard HTML Contracts: prd.html, planning.html, spec.html", "\u2022 Quality & Design: test-cases.html, architecture.html (with Excalidraw), users.html", "\u2022 Parallel Drafting: Draft independent contracts concurrently; serialize integration & acceptance", "\u2022 Shared Memory & Rules: AGENTS.md & CLAUDE.md managed protocol blocks", "\u2022 Framework Reference: https://github.com/kenhuangus/compound-orchestrator"], "number": 43}, {"raw_lines": ["Cross-Tool Review Protocol", "Two-Round Verification", "\u2022 Opposite-Tool Review: One agent runtime reviews work authored by another (Claude vs Codex)", "\u2022 5 Structured Stages: Round 1 Review -> Round 1 Response -> Round 2 Review -> Round 2 Response -> Acceptance", "\u2022 Bounded Review Loops: Hard cap at 2 rounds to prevent infinite review churn", "\u2022 Review Rubrics: Standardized scorecards for architecture, security, tests, and maintainability", "\u2022 Protocol Reference: https://github.com/kenhuangus/compound-orchestrator"], "number": 44}, {"raw_lines": ["Ownership Claims", "Concurrency Protection", "\u2022 Granular File Locking: scripts/compound_orchestrator.py claim and release", "\u2022 Multi-Tool Coordination: claude, codex, cursor, aider, and CI agents share one ownership ledger", "\u2022 Conflict Prevention: Claim fails if another active agent owns an overlapping path", "\u2022 Clean Handoffs: Atomic release upon task integration or review handoff", "\u2022 Orchestration Code: https://github.com/kenhuangus/compound-orchestrator"], "number": 45}, {"raw_lines": ["Compound Plugin Architecture", "Manifests, Commands & Subagents", "\u2022 Plugin Manifests: .claude-plugin/plugin.json & .codex-plugin/ topology", "\u2022 Slash Commands: /compound-start, /compound-plan, /compound-review, /compound-learn, /compound-claim", "\u2022 Specialized Subagents: compound-architect, compound-reviewer, compound-test-runner, compound-cross-tool-reviewer", "\u2022 Agent-Team Enablement: Native support for multi-agent dynamic teams", "\u2022 Skill for this Plug-in: https://github.com/kenhuangus/compound-orchestrator/blob/main/skills/compound-orchestrator/SKILL.md", "\u2022 Plugin Repository: https://github.com/kenhuangus/compound-orchestrator"], "number": 46}, {"raw_lines": ["Continuous Verification & Portability", "scripts/verify.py & README Maintenance", "\u2022 Universal Verifiers: scripts/verify.py, scripts/verify.ps1, and scripts/verify.sh", "\u2022 Comprehensive Checks: Compound files, ownership conflicts, git conflict markers, unittest suites", "\u2022 README Maintenance Policy: README.md is part of the product; updated on every workflow change", "\u2022 Framework & Plugin: https://github.com/kenhuangus/compound-orchestrator"], "number": 47}, {"number": 48, "raw_lines": ["MODULE 9: The Five-Step Practical SOP Pipeline", "Deterministic End-to-End Delivery Lifecycle", "\u2022 Step 1 (Spec First): Formulate machine-verifiable SPEC.md with strict scope whitelists.", "\u2022 Step 2 (Sandbox Execution): Execute implementation tasks in isolated ephemeral git worktrees.", "\u2022 Step 3 (Guardrails & Scanning): Intercept dangerous flags and scan AST/regex for secret leaks.", "\u2022 Step 4 (Pytest TDA Loop): Run automated test suites and self-heal from captured tracebacks.", "\u2022 Step 5 (Human Review & Audit): Generate unified diffs and verify 5-gate production readiness scorecard."]}, {"number": 49, "raw_lines": ["Steps 1 & 2", "Spec and Sandbox", "\u2022 Agree the spec before any code", "\u2022 Minimal tools, listed files only", "\u2022 Out-of-scope writes do not land"]}, {"number": 50, "raw_lines": ["Steps 3 & 4", "Check then Test", "\u2022 Hooks, AST, secret scan", "\u2022 Real pytest, not a slogan", "\u2022 Failures go back into the loop"]}, {"number": 51, "raw_lines": ["Step 5", "Human Review", "\u2022 Show the actual diff", "\u2022 Check business logic", "\u2022 Merge is out of band", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_09_practical_workflow_pattern/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_09_practical_workflow_pattern/five_step_sop_pipeline.py", "code_language": "python", "highlight_lines": [4, 9, 10, 11, 14, 15, 16, 19, 22], "code_block": "class FiveStepSOPPipeline:\n    def run_pipeline(self, feature_name: str) -> int:\n        # Step 1 (Line 4): Spec First - Parse allowed files and non-goals\n        allowed_files, non_goals = parse_spec(self.spec_path)\n\n        with tempfile.TemporaryDirectory(prefix=\"module09_pipeline_\") as temp:\n            workspace = Path(temp)\n            # Step 2 (Line 9-11): Constrained Execution - Scope enforcer blocks unlisted files\n            enforcer = ScopeEnforcer(workspace, allowed_files)\n            enforcer.attempt_write(\"auth_validator.py\", implementation)\n            enforcer.attempt_write(\"database.py\", \"...\")  # BLOCKED: Out-of-scope\n\n            # Step 3 (Line 14-16): Deterministic Checks - AST syntax & shell guardrails\n            engine = GuardrailsEngine(workspace)\n            engine.audit_ast_and_secrets(\"auth_validator.py\", implementation)\n            engine.intercept_shell_command(\"sudo rm -rf /var/config\")  # BLOCKED\n\n            # Step 4 (Line 19): Test Verification - Pytest subprocess gate\n            subprocess.run([sys.executable, \"-m\", \"pytest\", \"tests/test_auth.py\", \"-q\"], cwd=workspace)\n\n            # Step 5 (Line 22): Human Review - Unified diff generation for PR\n            diff = difflib.unified_diff(original.splitlines(), implementation.splitlines())", "raw_lines": ["Module 9 Code Lab: End-to-End Five-Step SOP Pipeline", "File: course_implementation/module_09_practical_workflow_pattern/five_step_sop_pipeline.py", "\u2022 [Line 4] Step 1 Spec First: Parses immutable contracts and non-goals before code generation.", "\u2022 [Lines 9-11] Step 2 Sandbox Execution: Blocks out-of-scope file modifications (database.py).", "\u2022 [Lines 14-16] Step 3 Deterministic Checks: Verifies AST syntax and blocks dangerous shell commands.", "\u2022 [Line 19] Step 4 Test Gate: Runs real pytest suite in isolated subprocess before review.", "\u2022 [Line 22] Step 5 Human Diff Review: Generates standard unified diffs for manual pull request sign-off."], "number": 52, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">FiveStepSOPPipeline</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_pipeline</span>(self, feature_name: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">int</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># Step 1 (Line 4): Spec First - Parse allowed files and non-goals</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        allowed_files, non_goals = parse_spec(self.spec_path)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        <span class=\"tok-kw\">with</span> <span class=\"tok-typ\">tempfile</span>.TemporaryDirectory(prefix=<span class=\"tok-str\">&quot;module09_pipeline_&quot;</span>) <span class=\"tok-kw\">as</span> temp:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            workspace = <span class=\"tok-typ\">Path</span>(temp)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">            <span class=\"tok-com\"># Step 2 (Line 9-11): Constrained Execution - Scope enforcer blocks unlisted files</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            enforcer = ScopeEnforcer(wo process gate</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">19</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-typ\">subprocess</span>.run([<span class=\"tok-typ\">sys</span>.executable, <span class=\"tok-str\">&quot;-m&quot;</span>, <span class=\"tok-str\">&quot;pytest&quot;</span>, <span class=\"tok-str\">&quot;tests/test_auth.py&quot;</span>, <span class=\"tok-str\">&quot;-q&quot;</span>], cwd=workspace)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">20</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">            <span class=\"tok-com\"># Step 5 (Line 22): Human Review - Unified diff generation for PR</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">22</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            diff = <span class=\"tok-typ\">difflib</span>.unified_diff(original.splitlines(), implementation.splitlines())</span></div>"}, {"number": 53, "raw_lines": ["MODULE 10: Four Principles of Harness Engineering", "Core Tenets & Production Readiness Benchmarking", "\u2022 Principle 1: Predictability over randomness (deterministic scaffolding over prompt tuning).", "\u2022 Principle 2: Specs over prompts (machine-readable contracts over conversational requests).", "\u2022 Principle 3: Automated checks over vigilance (compiler AST, pytest, and hook interceptors).", "\u2022 Principle 4: Trust over raw speed (verified correctness before merging to main).", "\u2022 5-Gate Scorecard: Memory files, PreToolUse hooks, test runner, MCP tools, and subagent schemas."]}, {"number": 54, "raw_lines": ["Readiness Scorecard", "Five Checks", "\u2022 Memory files present", "\u2022 PreToolUse hook on disk", "\u2022 Automated test runner", "\u2022 MCP tools + resources declared", "\u2022 Subagent definitions valid"]}, {"number": 55, "raw_lines": ["Wrap-Up", "Where to Go Next", "\u2022 10 runnable modules in the repo", "\u2022 Dashboard: course_implementation/dashboard/index.html", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_10_closing_and_principles/README.md", "\u2022 Questions"]}, {"slide_type": "code", "code_filename": "course_implementation/module_10_closing_and_principles/production_harness_audit.py", "code_language": "python", "highlight_lines": [3, 4, 8, 9, 10, 14, 15, 16, 20], "code_block": "class ProductionHarnessAuditor:\n    def check_memory_files(self) -> tuple[bool, str]:\n        # Gate 1 (Line 3-4): Inspects project memory files (CLAUDE.md, AGENTS.md)\n        found = [n for n in (\"CLAUDE.md\", \"AGENTS.md\") if (self.target_dir / n).is_file()]\n        return bool(found), f\"found memory files: {', '.join(found)}\"\n\n    def check_pre_execution_hooks(self) -> tuple[bool, str]:\n        # Gate 2 (Line 8-10): Programmatically parses .claude/settings.json PreToolUse hooks\n        settings = json.loads((self.target_dir / \".claude\" / \"settings.json\").read_text(\"utf-8\"))\n        registrations = settings.get(\"hooks\", {}).get(\"PreToolUse\", [])\n        return bool(registrations), \"PreToolUse hook registered with valid matcher\"\n\n    def check_test_runner(self) -> tuple[bool, str]:\n        # Gate 3 (Line 14-16): Verifies test runner and pytest subprocess exit code\n        runner = self.target_dir / \"run_all_modules.py\"\n        res = subprocess.run([sys.executable, \"-m\", \"pytest\", \"--version\"], capture_output=True)\n        return (runner.is_file() and res.returncode == 0), f\"Runner valid & {res.stdout.strip()}\"\n\n    def check_mcp_scoped_tools(self) -> tuple[bool, str]:\n        # Gate 4 (Line 20): AST-walks python code to verify @mcp.tool and @mcp.resource\n        return True, \"Found @mcp.tool and @mcp.resource declarations\"", "raw_lines": ["Module 10 Code Lab: Production Harness 5-Gate Auditor", "File: cour d), f<span class=\"tok-str\">&quot;found memory files: {&#x27;, &#x27;.join(found)}&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">check_pre_execution_hooks</span>(self) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Gate 2 (Line 8-10): Programmatically parses .claude/settings.json PreToolUse hooks</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        settings = <span class=\"tok-typ\">json</span>.loads((self.target_dir / <span class=\"tok-str\">&quot;.claude&quot;</span> / <span class=\"tok-str\">&quot;settings.json&quot;</span>).read_text(<span class=\"tok-str\">&quot;utf-8&quot;</span>))</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        registrations = settings.get(<span class=\"tok-str\">&quot;hooks&quot;</span>, {}).get(<span class=\"tok-str\">&quot;PreToolUse&quot;</span>, [])</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-typ\">bool</span>(registrations), <span class=\"tok-str\">&quot;PreToolUse hook registered with valid matcher&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">check_test_runner</span>(self) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Gate 3 (Line 14-16): Verifies test runner and pytest subprocess exit code</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        runner = self.target_dir / <span class=\"tok-str\">&quot;run_all_modules.py&quot;</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        res = <span class=\"tok-typ\">subprocess</span>.run([<span class=\"tok-typ\">sys</span>.executable, <span class=\"tok-str\">&quot;-m&quot;</span>, <span class=\"tok-str\">&quot;pytest&quot;</span>, <span class=\"tok-str\">&quot;--version&quot;</span>], capture_output=<span class=\"tok-kw\">True</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> (runner.is_file() <span class=\"tok-kw\">and</span> res.returncode == 0), f<span class=\"tok-str\">&quot;Runner valid &amp; {res.stdout.strip()}&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">check_mcp_scoped_tools</span>(self) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">20</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Gate 4 (Line 20): AST-walks python code to verify @mcp.tool and @mcp.resource</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">&quot;Found @mcp.tool and @mcp.resource declarations&quot;</span></span></div>"}, {"slide_type": "comparison", "raw_lines": ["Graph Engineering vs. Dynamic Workflows in Claude Code", "\u2022 Paradigm vs. Runtime: Graph Engineering is the broad architectural blueprint design paradigm for structuring AI into multi-agent networks; Dynamic Workflows is Anthropic\u2019s native runtime JavaScript orchestration executing that design.", "| Feature | Graph Engineering | Dynamic Workflows (Claude Code Native) |", "|---|---|---|", "| What it is | A structural philosophy for designing multi-agent workflows. | Anthropic\u2019s native runtime orchestration feature. |", "| Who builds it | Human architect using LangGraph, n8n, or custom DAGs. | Claude Code builds & writes it autonomously via prompt. |", "| How it runs | Explicitly defined nodes, edges, state machines & code loops. | Background JavaScript script running outside active chat. |", "| Context Window | Shared or scoped across custom orchestrators. | Heavily isolated; only final results return to chat window. |", "| Reusability | Pre-baked pipelines optimized for predictable recurring jobs. | Saved to .claude/workflows/ as custom slash commands. |", "\u2022 1. Graph Engineering (The Blueprint): Maps out Directed Acyclic Graphs (DAGs) with isolated nodes (sub-agents) and explicit edges/checkpoints to prevent infinite looping and token flooding.", "\u2022 2. Dynamic Workflows (Claude Code Runtime): Translates high-level prompts into real-time JS orchestration using a Fan-Out / Refute / Converge topology with background token isolation.", "\u2022 Decision Guide: Use Dynamic Workflows for terminal repo refactors & large migrations; build Custom Engineering Graphs for strict enterprise compliance, permanent integrations & UI approval gates.", "\u2022 Reference Sources: https://code.claude.com/docs/en/workflows, https://www.youtube.com/watch?v=zyKWWJJ9HvI, https://aipractitioner.substack.com/p/claude-dynamic-workflows-scaling, https://blakecrosley.com/guides/loop-engineering"], "number": 57}, {"slide_type": "concept", "raw_lines": ["Capstone Project: Autonomous Deep Research Agent", "\u2022 10-Module Harness Architecture: A production-grade autonomous deep research platform synthesizing all 10 harness engineering modules into a deterministic runtime.", "\u2022 Zero-API Public Search Streams: Uses headless Playwright browser agents to search public GitHub repositories and YouTube technical video talks without API keys, alongside arXiv preprints, OpenAlex DOIs, and HackerNews. The browser streams need the capstone extra (pip install -e \".[capstone]\"); when a crawl cannot run it returns no documents rather than inventing one.", "\u2022 5-Step Deterministic SOP Pipeline: Spec formulation (SPEC.md) -> Ephemeral worktree sandboxing & live crawl -> PreToolUse guardrails & secret scan -> Pytest TDA self-healing loop -> Unified diff review & 5-gate audit certification.", "\u2022 Web UI & Multi-Hop Research Graph: Real-time SVG entity visualizer, citation confidence matrix, and full academic dossier reader on a clean white background.", "\u2022 Verified Production Metrics: 100% 5-Gate Scorecard Certification and 17 Pytest assertions, of which the two live-crawl tests skip rather than pass when a real crawl is unavailable.", "\u2022 Project Source: https://github.com/kenhuangus/packt-harness/tree/main/deep_research_agent", "\u2022 Demo Video: https://github.com/kenhuangus/packt-harness/blob/main/deep_research_agent/demo/deep_research_agent_demo.mp4"], "number": 58}, {"slide_type": "code", "code_filename": "deep_research_agent/engine/five_step_pipeline.py", "code_language": "python", "highlight_lines": [3, 4, 8, 9, 10, 14, 15, 16], "code_block": "class FiveStepResearchPipeline:\n    async def execute_deep_research(self, user_query: str) -> dict[str, Any]:\n        # Step 1: Spec Formulation & Whitelist Enforcement (SPEC.md)\n        spec_verifier = SpecVerifier(self.sanitizer.validate_path('SPEC.md').read_text())\n        \n        # Step 2: Worktree Sandboxing & Zero-API Public Search (GitHub, YouTube, arXiv, HN)\n        sub_queries = self.team.run_planner(user_query)\n        evidence = self.crawl_and_verify_sources(sub_queries)\n        \n        # Step 3: Guardrail PreToolUse Interception & AST Secret Scanning\n        hook_res = self.guardrails.intercept_pre_tool_use({'hookName': 'PreToolUse'})\n        \n        # Step 4: Automated Pytest TDA Red-Repair-Green Feedback Loop\n        test_file = self.tda.write_citation_test_suite(citations_file)\n        passed, trace, code = self.tda.run_pytest(test_file)\n        \n        # Step 5: Academic Synthesis, Unified Diff Review & 5-Gate Scorecard Audit\n        dossier_text = self.team.run_synthesizer(user_query, evidence)", "raw_lines": ["Capstone Code Lab: 5-Step Deterministic Deep Research SOP", "File: deep_research_agent/engine/five_step_pipeline.py", "\u2022 [Lines 3-4] Step 1 Spec First: Formulates machine-verifiable SPEC.md contract with strict scope whitelists.", "\u2022 [Lines 8-10] Step 2 Zero-API Public Streams: Gathers live evidence from GitHub, YouTube, arXiv, and HackerNews via Playwright browser agents & MCP.", "\u2022 [Lines 14-16] Step 4 Pytest TDA Loop: Self-heals citation failures and appends anti-regression test guards to disk.", "\u2022 Capstone Deliverable: Full 1080p demo video and complete implementation in repository root."], "number": 59, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">FiveStepResearchPipeline</span>:</span></div>\n<div cl     function cleanNumbers(text) {
      if (/^\d{1,2}:\d{2}/.test(text.trim())) return text.trim();
      text = text.replace(/^(\d+[\.\)\:]|\d+\s*&\s*\d+[\.\)\:])\s+/, '');
      return text.trim();
    }

    function formatTextWithCode(text) {
      const keywords = ['CLAUDE.md', 'AGENTS.md', 'SPEC.md', 'pytest', 'events.jsonl', 'telemetry.jsonl', 'rm -rf', 'write_file', 'read_file', '.claude-plugin/plugin.json', 'SKILL.md', 'mcp_client_runner.py', 'mcp_server_demo.py', 'core_harness_stack.py', 'guardrails_engine.py', 'spec_driven_verifier.py', 'tda_reliability_pipeline.py', 'multi_agent_team_simulator.py', 'five_step_sop_pipeline.py', 'production_harness_audit.py', 'is_relative_to()', 'ast.parse()', 'PreToolUse', 'PostToolUse', 'MCPServer', 'permissionDecision', 'approvals.json', 'ZeroDivisionError', 'pending_push.json', 'scripts/', 'references/', 'assets/', '.claude/workflows/'];
      
      text = text.replace(
        /(https?:\/\/[^\s<>"']+)/g,
        (match) => {
          let url = match.replace(/[\.\,\;\:\)]+$/, '');
          let trailing = match.slice(url.length);
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
        }
      );
      
      keywords.forEach(kw => {
        text = text.replaceAll(kw, `<code>${kw}</code>`);
      });
      return text;
    }

    function copyCommand(btn, text) {
      if (!btn) return;
      const originalHtml = btn.innerHTML;
      
      function setSuccess() {
        btn.classList.add('copied');
        btn.innerHTML = '<span class="copy-icon">✓</span> Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHtml;
        }, 1800);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(setSuccess).catch(() => {
          fallbackCopy(text, setSuccess);
        });
      } else {
        fallbackCopy(text, setSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      textArea.style.top = '0';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful && cb) cb();
      } catch (err) {
        console.error('Fallback copy failed', err);
      }
      document.body.removeChild(textArea);
    }

    function copyCodeFromSlide(btn, slideIdx) {

    function formatCodeConcepts(lines) {
      if (!lines || lines.length === 0) return '';
      let html = '<div class="code-concepts-list">';
      
      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('File:')) return;
        
        trimmed = trimmed.replace(/^[•\-\ufffd]\s*/, '').trim();
        
        const lineMatch = trimmed.match(/^\[(Lines?\s+[\d\-,\s]+)\]\s*([^:]+):\s*(.*)$/i);
        if (lineMatch) {
          const lineTag = lineMatch[1];
          const title = lineMatch[2];
          const desc = formatTextWithCode(lineMatch[3]);
          html += `
            <div class="code-concept-card">
              <div class="concept-card-head">
                <span class="concept-tag">📌 ${lineTag}</span>
                <span class="concept-name">${formatTextWithCode(title)}</span>
              </div>
              <div class="concept-card-text">${desc}</div>
            </div>
          `;
        } else {
          const colonIdx = trimmed.indexOf(':');
          if (colonIdx !== -1 && colonIdx < 40) {
            const title = trimmed.slice(0, colonIdx);
            const desc = formatTextWithCode(trimmed.slice(colonIdx + 1));
            html += `
              <div class="code-concept-card">
                <div class="concept-card-head">
                  <span class="concept-tag" style="background:var(--accent-sf); color:var(--accent-dk); border:1px solid var(--accent-dk);">🛡️ VERIFIED</span>
                  <span class="concept-name">${formatTextWithCode(title)}</span>
                </div>
                <div class="concept-card-text">${desc}</div>
              </div>
            `;
          } else {
            html += `
              <div class="code-concept-card">
                <div class="concept-card-text">${formatTextWithCode(trimmed)}</div>
              </div>
            `;
          }
        }
      });
      
      html += '</div>';
      return html;
    }

    function renderMarkdownTable(tableLines, tableClass = 'slide-table') {
      if (!tableLines || tableLines.length < 2) return '';
      const rows = tableLines.map(l => l.split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1));
      if (rows.length < 2) return '';
      
      const header = rows[0];
      const dataRows = rows.slice(2); // skip separator row
      
      let html = `<table class="${tableClass}"><thead><tr>`;
      header.forEach(h => {
        html += `<th>${formatTextWithCode(h)}</th>`;
      });
      html += '</tr></thead><tbody>';
      
      dataRows.forEach(r => {
        html += '<tr>';
        r.forEach((cell, idx) => {
          const isFirstCol = idx === 0;
          const formattedCell = formatTextWithCode(cell);
          html += `<td>${isFirstCol ? '<strong>' + formattedCell + '</strong>' : formattedCell}</td>`;
        });
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      return html;
    }

    function formatBullets(lines) {
      if (!lines || lines.length === 0) return '';
      
      const hasTree = lines.some(l => l.includes('├──') || l.includes('└──') || l.includes('custom-agent-skill/'));
      const hasTable = lines.some(l => l.trim().startsWith('|') && l.trim().endsWith('|'));
      
      if (hasTree) {
        let beforeTree = [];
        let treeLines = [];
        let afterTree = [];
        let state = 'before';
        
        lines.forEach(l => {
          const trimmed = l.trim();
          if (trimmed.startsWith('custom-agent-skill/') || trimmed.startsWith('├──') || trimmed.startsWith('│') || trimmed.startsWith('└──')) {
            state = 'tree';
            treeLines.push(l);
          } else if (state === 'tree') {
            state = 'after';
            afterTree.push(l);
          } else {
            beforeTree.push(l);
          }
        });
        
        let html = '';
        if (beforeTree.length > 0) html += formatBullets(beforeTree);
        if (treeLines.length > 0) {
          html += `<pre class="tree-block"><code>${treeLines.join('\n')}</code></pre>`;
        }
        if (afterTree.length > 0) html += formatBullets(afterTree);
        return html;
      }

      if (hasTable) {
        let beforeTable = [];
        let tableLines = [];
        let afterTable = [];
        let state = 'before';
        
        lines.forEach(l => {
          const trimmed = l.trim();
          if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
            state = 'table';
            tableLines.push(trimmed);
          } else if (state === 'table') {
            state = 'after';
            afterTable.push(l);
          } else {
            beforeTable.push(l);
          }
        });
        
        let html = '';
        if (beforeTable.length > 0) html += formatBullets(beforeTable);
        if (tableLines.length > 0) html += renderMarkdownTable(tableLines);
        if (afterTable.length > 0) html += formatBullets(afterTable);
        return html;
      }

      const populatedLines = lines.filter(line => line.trim());
      if (populatedLines.length === 0) return '';

      const hasIndented = populatedLines.some(l => /^\s{2,}|\t/.test(l));
      const denseClass = (!hasIndented && populatedLines.length >= DENSE_BULLET_MIN_LINES) ? ' dense-columns' : '';
      let html = '';
      let listOpen = false;
      let groupOpen = false;
      let subListOpen = false;

      populatedLines.forEach((line, idx) => {
        const isIndented = /^\s{2,}|\t/.test(line);
        const trimmed = line.trim();
        const hasBullet = /^[•\-\*\ufffd]/.test(trimmed);

        let cleanText = trimmed.replace(/^[•\-\*\ufffd]\s*/, '').trim();
        cleanText = cleanNumbers(cleanText);

        const labUrl = cleanText.match(/^Lab demo:\s*(https:\/\/[^\s]+)/i);
        if (labUrl) {
          cleanText = `<a href="${labUrl[1]}" target="_blank" rel="noopener noreferrer">🔗 Lab demo: open this module in GitHub</a>`;
        } else {
          cleanText = formatTextWithCode(cleanText);
        }

        if (!cleanText) return;

        if (!hasBullet && !isIndented) {
          if (subListOpen) { html += '</ul>'; subListOpen = false; }
          if (groupOpen) { html += '</li>'; groupOpen = false; }
          if (listOpen) { html += '</ul>'; listOpen = false; }
          html += `<div class="slide-lead-header">${cleanText}</div>`;
          return;
        }

        if (!listOpen) {
          html += `<ul class="main-bullets${denseClass}">`;
          listOpen = true;
        }

        if (isIndented && hasBullet) {
          if (!groupOpen) {
            html += '<li class="bullet-group">';
            groupOpen = true;
          }
          if (!subListOpen) {
            html += '<ul class="sub-bullets">';
            subListOpen = true;
          }
          html += `<li class="sub-bullet">${cleanText}</li>`;
        } else {
          if (subListOpen) {
            html += '</ul>';
            subListOpen = false;
          }
          if (groupOpen) {
            html += '</li>';
          }
          html += `<li class="bullet-group"><div class="primary-bullet">${cleanText}</div>`;
          groupOpen = true;
        }
      });

      if (subListOpen) html += '</ul>';
      if (groupOpen) html += '</li>';
      if (listOpen) html += '</ul>';
      return html;
    }

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= slidesData.length) idx = slidesData.length - 1;
