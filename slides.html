<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packt Masterclass Presentation: 85 Interactive Code, Architecture & Skill Slides</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0EEE6;
      --surface: #FAF9F5;
      --surface-alt: #F5E6DF;
      --ink: #141413;
      --ink-muted: #6B6B63;
      --rule: #E3E0D6;
      --accent: #D97757;
      --accent-dk: #BD5D3A;
      --accent-sf: #F5E6DF;
      --code-bg: #1A1A18;
      --code-rule: #333330;
      --font-display: ui-serif, Georgia, "Times New Roman", serif;
      --font-body: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      --font-code: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 46px;
      flex: 0 0 46px;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.0rem;
      z-index: 50;
      gap: 0.75rem;
      overflow-x: auto;
    }
    .header-left { display: flex; align-items: center; gap: 0.7rem; flex: 0 0 auto; }
    .brand-logo {
      width: 30px; height: 30px;
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      border-radius: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .brand-title { font-weight: 650; font-size: 0.90rem; white-space: nowrap; }

    .controls { display: flex; align-items: center; gap: 0.40rem; flex: 0 0 auto; }
    .btn {
      background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
      padding: 0.35rem 0.65rem; border-radius: 8px; font-weight: 600; font-size: 0.80rem;
      cursor: pointer; transition: background-color 0.16s, border-color 0.16s; text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-sf); border-color: var(--accent); }
    .btn:focus-visible, .slide-select:focus-visible, .goto-input:focus-visible { outline: 2px solid var(--accent-dk); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
    .btn-primary:hover { background: var(--accent-sf); border-color: var(--accent-dk); color: var(--ink); }
    
    .goto-group {
      display: flex;
      align-items: center;
      gap: 0.22rem;
      background: var(--bg);
      padding: 0.12rem 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .goto-input {
      width: 48px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule);
      padding: 0.25rem 0.35rem;
      border-radius: 6px;
      font-family: var(--font-code);
      font-size: 0.80rem;
      font-weight: 750;
      text-align: center;
      -moz-appearance: textfield;
    }
    .goto-input::-webkit-outer-spin-button,
    .goto-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn-goto {
      padding: 0.26rem 0.50rem;
      font-weight: 700;
      font-size: 0.78rem;
    }

    select.slide-select {
      background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.35rem 0.55rem; border-radius: 8px; font-family: var(--font-body);
      font-size: 0.80rem; font-weight: 600;
      max-width: 290px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide-viewport {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: clamp(0.30rem, 0.8vw, 0.70rem);
    }
    .slide-card {
      width: 100%; max-width: 1380px; height: 100%;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: 12px; padding: clamp(0.80rem, 1.5vw, 1.40rem); display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .slide-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 0.8rem; margin-bottom: 0.35rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.35rem;
      flex: 0 0 auto;
    }
    .slide-title-wrap { min-width: 0; }
    .slide-title {
      font-family: var(--font-display); font-size: clamp(1.40rem, 2.2vw, 1.95rem);
      font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; color: var(--ink);
    }
    .slide-num-badge {
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.22rem 0.60rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 750; white-space: nowrap;
      flex: 0 0 auto;
    }
    .slide-body {
      --fit-scale: 1;
      --slide-body-base-size: 1.30rem;
      flex: 1; min-height: 0; overflow-y: auto; padding-right: 0.20rem;
      font-size: calc(var(--slide-body-base-size) * var(--fit-scale));
      line-height: 1.50; color: var(--ink);
    }

    code {
      font-family: var(--font-code);
      background: var(--accent-sf);
      color: var(--accent-dk);
      padding: 0.08rem 0.32rem;
      border-radius: 4px;
      font-size: 0.90em;
      white-space: nowrap;
      border: 1px solid var(--rule);
    }
    pre code, .tree-block code, .code-editor-body code {
      white-space: pre !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: inherit !important;
    }
    .slide-content-wrapper {
      width: 100%;
      display: block;
    }
    .slide-body > svg, .slide-svg {
      display: block; width: 100% !important; height: auto; max-width: 100%;
      margin: 0.35rem 0 0.65rem 0;
    }

    /* Comparison Table Styling */
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.35rem 0 0.60rem 0;
      font-size: 0.88rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .slide-table th {
      background: var(--accent-sf);
      color: var(--ink);
      font-weight: 750;
      text-align: left;
      padding: 0.45rem 0.70rem;
      border-bottom: 1.5px solid var(--rule);
      font-family: var(--font-display);
      font-size: 0.95rem;
    }
    .slide-table td {
      padding: 0.40rem 0.70rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      line-height: 1.38;
      vertical-align: middle;
    }
    .slide-table tr:last-child td {
      border-bottom: none;
    }
    .slide-table tr:nth-child(even) td {
      background: rgba(245, 230, 223, 0.25);
    }

    /* Enhanced Code Slide Layout with Line-Level Highlights */
    .code-slide-container {
      display: grid;
      grid-template-columns: minmax(0, 1.32fr) minmax(0, 1.08fr);
      gap: 1.05rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 1020px) {
      .code-slide-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .code-editor-window {
      background: var(--code-bg);
      border: 1px solid var(--code-rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      max-height: calc(100vh - 135px);
    }
    .code-editor-header {
      background: #242320;
      border-bottom: 1px solid var(--code-rule);
      padding: 0.40rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .code-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .code-dot {
      width: 9px; height: 9px; border-radius: 50%;
    }
    .dot-red { background: #E06C75; }
    .dot-yellow { background: #E5C07B; }
    .dot-green { background: #98C379; }
    .code-file-tag {
      font-family: var(--font-code);
      font-size: 0.78rem;
      color: #A0A09A;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .code-lang-tag {
      background: #333330;
      color: #D97757;
      font-family: var(--font-code);
      font-size: 0.70rem;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .code-block {
      background: var(--code-bg);
      color: #FAF9F5;
      font-family: var(--font-code);
      font-size: 0.86rem;
      line-height: 1.42;
      padding: 0.45rem 0;
      margin: 0;
      overflow-x: auto;
      overflow-y: auto;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      padding: 0.06rem 0.55rem;
      transition: background-color 0.15s;
    }
    .code-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .code-line-hl {
      background: rgba(217, 119, 87, 0.22);
      border-left: 3.5px solid var(--accent);
      padding-left: calc(0.55rem - 3.5px);
    }
    .line-num {
      color: #5C5C56;
      width: 24px;
      flex: 0 0 24px;
      text-align: right;
      margin-right: 8px;
      font-size: 0.78rem;
      user-select: none;
    }
    .code-line-hl .line-num {
      color: var(--accent);
      font-weight: 700;
    }
    .key-badge {
      background: var(--accent);
      color: #FAF9F5;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
      margin-right: 8px;
      letter-spacing: 0.03em;
      user-select: none;
      flex: 0 0 auto;
    }
    .line-code {
      flex: 1;
      white-space: pre;
    }

    /* Syntax Highlighting Colors */
    .tok-kw { color: #E58A6D; font-weight: 600; }
    .tok-str { color: #89CA78; }
    .tok-com { color: #7F7F78; font-style: italic; }
    .tok-dec { color: #E5C07B; font-weight: 600; }
    .tok-typ { color: #61AFEF; font-weight: 600; }
    .tok-fn { color: #61AFEF; font-weight: 600; }
    .tok-cls { color: #E5C07B; font-weight: 700; }

    /* Code Slide Dedicated Concepts Column */
    .code-concepts-column {
      display: flex;
      flex-direction: column;
      gap: 0.60rem;
      overflow-y: auto;
      max-height: calc(100vh - 135px);
      padding-right: 0.20rem;
    }
    .code-concepts-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .code-concept-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent);
      border-radius: 8px;
      padding: 0.65rem 0.90rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .concept-card-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
    }
    .concept-tag {
      background: var(--accent);
      color: #FAF9F5;
      font-size: 0.70rem;
      font-weight: 750;
      padding: 0.10rem 0.42rem;
      border-radius: 4px;
      font-family: var(--font-code);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .concept-name {
      font-family: var(--font-display);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--ink);
    }
    .concept-card-text {
      font-size: 0.92rem;
      color: var(--ink);
      line-height: 1.42;
    }

    .invariant-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent-dk);
      border-radius: 8px;
      padding: 0.65rem 0.90rem;
      font-size: 0.88rem;
      color: var(--ink-muted);
      line-height: 1.40;
    }
    .invariant-title {
      font-family: var(--font-display);
      font-size: 1.00rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.22rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Dedicated Skill Slide Layout */
    .skill-slide-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.0fr) minmax(0, 1.15fr);
      gap: 1.25rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 980px) {
      .skill-slide-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .skill-meta-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      padding: 1.10rem;
      display: flex;
      flex-direction: column;
      gap: 0.70rem;
      box-shadow: 0 4px 14px rgba(217, 119, 87, 0.08);
    }
    .skill-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-sf);
      color: var(--accent-dk);
      border: 1px solid var(--accent);
      font-family: var(--font-code);
      font-weight: 800;
      font-size: 0.84rem;
      padding: 0.24rem 0.60rem;
      border-radius: 6px;
      width: fit-content;
    }
    .skill-name-heading {
      font-family: var(--font-code);
      font-size: 1.30rem;
      font-weight: 800;
      color: var(--ink);
      word-break: break-all;
    }
    .skill-desc-box {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent);
      border-radius: 6px;
      padding: 0.70rem 0.90rem;
      font-size: 0.96rem;
      line-height: 1.46;
      color: var(--ink);
    }
    .skill-tools-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
    }
    .skill-links-box {
      font-size: 0.88rem;
      color: var(--ink-muted);
      margin-top: 0.3rem;
      line-height: 1.46;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      border-top: 1px dashed var(--rule);
      padding-top: 0.55rem;
    }
    .skill-details-column {
      display: flex;
      flex-direction: column;
      gap: 0.70rem;
      overflow-y: auto;
      max-height: calc(100vh - 135px);
    }
    .skill-detail-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent-dk);
      border-radius: 8px;
      padding: 0.75rem 1.00rem;
    }
    .skill-detail-title {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 750;
      color: var(--ink);
      margin-bottom: 0.30rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .skill-detail-body {
      font-size: 0.94rem;
      color: var(--ink);
      line-height: 1.44;
    }

    /* Monospace Tree Display for Structure Slides */
    .tree-block {
      background: var(--code-bg);
      color: #FAF9F5;
      font-family: var(--font-code);
      font-size: 0.86rem;
      line-height: 1.44;
      padding: 0.80rem 1.05rem;
      border-radius: 8px;
      border: 1px solid var(--code-rule);
      margin: 0.45rem 0;
      overflow-x: auto;
    }

    /* Visual Hierarchy: Parent vs Sub Bullets */
    .main-bullets { list-style-type: none; padding-left: 0; margin-top: 0.30rem; }
    .main-bullets.dense-columns {
      column-count: 2; column-gap: clamp(1.2rem, 3vw, 2.5rem); column-fill: balance;
    }
    .bullet-group, .primary-bullet, .sub-bullets, .sub-bullet {
      break-inside: avoid; page-break-inside: avoid;
    }
    .primary-bullet {
      font-family: var(--font-display); font-size: 1.04em; font-weight: 650; color: var(--ink);
      margin-top: 0.35em; margin-bottom: 0.18em; position: relative; padding-left: 1.25em; line-height: 1.46;
    }
    .primary-bullet::before {
      content: "◆"; color: var(--accent); font-size: 0.72em; line-height: 1; position: absolute; left: 0; top: 0.18em;
    }
    .sub-bullets {
      list-style-type: none; padding-left: 1.25em; border-left: 2px solid var(--rule);
      margin-left: 0.40em; margin-top: 0.20em; margin-bottom: 0.40em; display: flex; flex-direction: column; gap: 0.22em;
    }
    .sub-bullet {
      font-size: 0.92em; color: var(--ink); margin-bottom: 0.15em; position: relative; padding-left: 1.15em;
      line-height: 1.42;
    }
    .sub-bullet::before {
      content: "›"; position: absolute; left: 0; top: -0.05em; color: var(--accent-dk); font-weight: 900; font-size: 1.25em; line-height: 1;
    }
    .slide-lead-header {
      font-family: var(--font-display);
      font-size: 1.15em;
      font-weight: 750;
      color: var(--accent-dk);
      margin-top: 0.15em;
      margin-bottom: 0.40em;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    /* Capstone Slide 83 Two-Column Grid */
    .capstone-layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 0.90rem;
      height: 100%;
      align-items: stretch;
    }
    @media (max-width: 1040px) {
      .capstone-layout-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .capstone-info-card {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }
    .capstone-info-body {
      padding: 0.60rem 0.80rem;
      display: flex;
      flex-direction: column;
      gap: 0.50rem;
      font-size: 0.84rem;
      background: var(--surface);
      flex: 1;
    }
    .capstone-section {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }
    .capstone-section-title {
      font-family: var(--font-display);
      font-size: 0.84rem;
      font-weight: 750;
      color: var(--accent-dk);
    }
    .capstone-cmd-box {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      font-size: 0.77rem;
    }
    .capstone-cmd-box code {
      font-size: 0.78rem;
      padding: 0.08rem 0.28rem;
    }
    .cmd-note {
      color: var(--ink-muted);
      font-size: 0.75rem;
      margin-left: 0.25rem;
    }
    .capstone-providers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      font-size: 0.75rem;
    }
    .provider-pill {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 0.22rem 0.40rem;
      line-height: 1.25;
    }
    .capstone-text-desc {
      font-size: 0.78rem;
      line-height: 1.38;
      color: var(--ink);
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
    }

    /* Slide 3 Course Master Map: Two-Column Part 1 (Left) & Part 2 (Right) */
    .course-map-slide-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .course-map-columns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.10rem;
      flex: 1;
      align-items: stretch;
    }
    .course-map-part-col {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 8px;
      padding: 0.85rem 1.15rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .course-map-part-header {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--accent-dk);
      letter-spacing: -0.01em;
      margin-bottom: 0.65rem;
      padding-bottom: 0.40rem;
      border-bottom: 1.5px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .course-map-module-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-size: 1.02rem;
      color: var(--ink);
    }
    .course-map-module-list li {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      line-height: 1.40;
    }

      <div class="goto-group">
        <input type="number" id="goto-input" min="1" max="86" placeholder="#" class="goto-input" title="Enter slide number (1-86)" onkeydown="if(event.key==='Enter') jumpToEnteredSlide()">

      </div>
      <button id="btn-next" class="btn" onclick="nextSlide()">Next ❯</button>

    </div>
  </header>

  <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

  <main>
    <div id="presentation-mode" class="slide-viewport">
      <div class="slide-card">
        <div class="slide-header">
          <div class="slide-title-wrap">
            <div id="slide-title" class="slide-title">Slide Title</div>
          </div>

  <script>
    const slidesData = [{"number": 1, "raw_lines": ["Hands-On Harness Engineering with Claude", "GitHub: https://github.com/kenhuangus/packt-harness", "Site: https://kenhuangus.github.io/packt-harness/slides.html#1"]}, {"number": 2, "raw_lines": ["About the Instructor: Ken Huang, CISSP", "\u2022 \ud83d\udcda AI Book Author & Speaker (Harness Engineering, MAESTRO)", "\u2022 \ud83c\udf93 Adjunct Professor, University of San Francisco", "\u2022 \ud83d\udee1\ufe0f OWASP AIVSS Project Lead", "\u2022 \ud83e\udd1d Fellow & Co-Chair of two CSA AI Safety Working Groups", "\u2022 \ud83d\udd1f Core Member, OWASP Top 10 for LLM Applications", "\u2022 \ud83c\udfdb\ufe0f AIUC-1 Consortium Member", "\u2022 \ud83d\udd2c Grant Review Member for Schmidt Sciences", "\u2022 \ud83e\uddd1\u200d\ud83c\udfeb EC-Council Instructor \u2014 Generative AI for Cyber Security", "\u2022 \ud83d\ude80 CEO of DistributedApps.ai: https://distributedapps.ai/"]}, {"number": 3, "raw_lines": ["The Masterclass Core Thesis: Traditional SE vs. Harness Engineering", "Deterministic IT Engineering \u2794 Non-Deterministic Agentic AI Control Systems", "\u2022 Traditional Software Engineering: Built for deterministic IT systems using frameworks (SDLC, Agile, DevOps, CI/CD, architecture patterns, testing pyramids, SRE, secure-SDLC/AppSec) to encode explicit logic with repeatable outputs for identical inputs.", "\u2022 Harness Engineering: The corresponding engineering discipline for non-deterministic agentic AI systems, where runtime behavior emerges probabilistically from a model plus prompts, dynamic context, memory, tools, execution loops, policies, evaluations, and multi-agent orchestration.", "\u2022 The Core Role of the Harness: Engineers the deterministic control environment surrounding the model so agentic AI systems become reliable, observable, secure, governable, and operationally manageable.", "\u2022 Deterministic Control Layer: Memory (CLAUDE.md/AGENTS.md) \u00b7 Path Sandboxing (Path.is_relative_to()) \u00b7 Hooks (PreToolUse/PostToolUse) \u00b7 Test Feedback (Pytest TDA) \u00b7 Permission Gateways (approvals.json)."]}, {"number": 4, "raw_lines": ["COURSE MASTER MAP", "PART 1: FOUNDATIONS & CONTROL", "\u2022 Mod 1: Why Harness Engineering", "\u2022 Mod 2: Core Harness Stack", "\u2022 Mod 3: Spec-Driven Development", "\u2022 Mod 4: Guardrails & Hooks", "\u2022 Mod 5: Permission Gateways", "PART 2: RELIABILITY & TEAMS", "\u2022 Mod 6: Tests as Reliability", "\u2022 Mod 7: Agent Extensions (Skills, Plugins, MCP)", "\u2022 Mod 8: Compound Engineering", "\u2022 Mod 9: Five-Step SOP", "\u2022 Mod 10: Principles & Audit"]}, {"number": 5, "raw_lines": ["MODULE 1: Why Harness Engineering", "Probabilistic Model vs. Deterministic Control System", "\u2022 Model Capability \u2260 production reliability: Fast generation, weak follow-through without harness controls.", "\u2022 Probabilistic Model Layer: Proposes code; prone to amnesia, hallucination, drift, and retry traps.", "\u2022 Deterministic Harness Layer: Enforces sandboxing, AST parsing, loop detection, and secret scanning.", "\u2022 Key Failure Modes: Context decay, repetitive execution loops, destructive shell commands, unverified edits.", "\u2022 Core Mandate: The harness, not the model, is the control system \u2014 optimize for trust over raw speed."]}, {"number": 6, "raw_lines": ["Failure Mode 1: Context Decay", "Amnesia", "\u2022 Forgets constraints after long chats", "\u2022 Edits the wrong files", "\u2022 Fix: CLAUDE.md / AGENTS.md"]}, {"number": 7, "raw_lines": ["Failure Mode 2: Execution Loops", "Retry Traps & Token Bleed", "\u2022 The Hazard: Agents executing the exact same failing command with minor punctuation tweaks in an infinite loop.", "\u2022 Failure Impact: Burns token budgets, stalls progress indefinitely, and pollutes context memory.", "\u2022 Deterministic Defense: Sliding-window memory tracks command history and triggers a LoopDetector RuntimeError after max_retries.", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_01_why_harness_engineering/README.md"]}, {"number": 8, "raw_lines": ["Failure Mode 3: Dangerous Tools", "Unsanitized Actions & Destructive Commands", "\u2022 The Hazard: Agents executing rm -rf, sudo, chmod 777, or modifying host files outside the repository.", "\u2022 Impact: Overwrites configurations, drops databases, and corrupts host environments.", "\u2022 Fix: PreToolUse interceptor guards block dangerous shell commands before subprocess execution; Path.is_relative_to() prevents path traversal.", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_01_why_harness_engineering/README.md"]}, {"number": 9, "raw_lines": ["Universal Environment Setup (Run Once)", "Interactive Terminal Setup for All 10 Module Labs", "\u2022 First time here? Set up once, then every module lab runs the same way:", "  \u2022 Step 1 - Clone it (not a ZIP: module 8 drives git worktree and needs .git): git clone https://github.com/kenhuangus/packt-harness.git", "  \u2022 Step 2 - Enter directory & create venv: cd packt-harness then python -m venv .venv", "  \u2022 Step 3 - Install: .venv\\Scripts\\python.exe -m pip install -e .   (macOS/Linux: .venv/bin/python -m pip install -e .)", "  \u2022 Step 4 - Check it: python run_all_modules.py   expects Summary: 14 passed, 0 failed", "  \u2022 Why the venv: each module launches pytest with sys.executable, so the interpreter that starts a module is the one that runs its tests - it cannot pass by finding another Python on PATH", "  \u2022 Full setup, cloud model keys (OpenAI, Claude, Gemini) and the browser extra: https://github.com/kenhuangus/packt-harness/blob/main/README.md", "  \u2022 Interactive Lab Demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_01_why_harness_engineering/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_01_why_harness_engineering/harness_vs_model_demo.py", "code_language": "python", "highlight_lines": [8, 9, 10, 15, 16, 17, 18], "code_block": "class HarnessedAgent:\n    def __init__(self, max_retries: int = 2) -> None:\n        self.max_retries = max_retries\n        self.command_history: list[str] = []\n\n    def pre_execution_hook(self, command: str) -> None:\n        # Line 7-10: Deterministic regex guard against destructive shell calls\n        for pattern in FORBIDDEN_PATTERNS:  # ['rm -rf', 'sudo', 'chmod 777']\n            if re.search(pattern, command):\n                raise PermissionError(f\"BLOCKED BY PRE-HOOK: '{pattern}' detected.\")\n\n    def loop_detector(self, command: str) -> None:\n        # Line 13-18: Sliding-window memory breaks infinite retry loops\n        self.command_history.append(command)\n        if len(self.command_history) >= self.max_retries:\n            recent = self.command_history[-self.max_retries:]\n            if len(set(recent)) == 1:\n                raise RuntimeError(f\"LOOP DETECTOR: '{command}' repeated {self.max_retries}x.\")", "raw_lines": ["Module 1 Code Lab: Pre-Hook Interception & Loop Detection", "File: course_implementation/module_01_why_harness_engineering/harness_vs_model_demo.py", "\u2022 [Lines 8-10] Pre-Execution Interception: Regex matches against destructive commands (rm -rf, sudo) and raises PermissionError before subprocess creation.", "\u2022 [Lines 15-18] Loop Detector: Sliding-window tracks recent command history and raises RuntimeError after max_retries, halting infinite retry loops.", "\u2022 Verified Execution: Un-harnessed agent deletes var/log/app.log and loops indefinitely; harnessed agent halts safely with log_survived=True."], "number": 10, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">HarnessedAgent</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">__init__</span>(self, max_retries: <span class=\"tok-typ\">int</span> = 2) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        self.max_retries = max_retries</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        self.command_history: <span class=\"tok-typ\">list</span>[<span class=\"tok-typ\">str</span>] = []</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">pre_execution_hook</span>(self, command: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 7-10: Deterministic regex guard against destructive shell calls</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">for</span> pattern <span class=\"tok-kw\">in</span> FORBIDDEN_PATTERNS:  <span class=\"tok-com\"># [&#x27;rm -rf&#x27;, &#x27;sudo&#x27;, &#x27;chmod 777&#x27;]</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">re</span>.search(pattern, command):</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">                <span class=\"tok-kw\">raise</span> <span class=\"tok-typ\">PermissionError</span>(f<span class=\"tok-str\">&quot;BLOCKED BY PRE-HOOK: &#x27;{pattern}&#x27; detected.&quot;</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">loop_detector</span>(self, command: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 13-18: Sliding-window memory breaks infinite retry loops</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        self.command_history.append(command)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> len(self.command_history) &gt;= self.max_retries:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            recent = self.command_history[-self.max_retries:]</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">17</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> len(<span class=\"tok-typ\">set</span>(recent)) == 1:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">                <span class=\"tok-kw\">raise</span> <span class=\"tok-typ\">RuntimeError</span>(f<span class=\"tok-str\">&quot;LOOP DETECTOR: &#x27;{command}&#x27; repeated {self.max_retries}x.&quot;</span>)</span></div>"}, {"number": 11, "raw_lines": ["MODULE 2: The 5 Core Harness Pillars", "Architectural Scaffolding for Coding Agents", "\u2022 Pillar 1: Memory (CLAUDE.md & AGENTS.md persistent project instructions)", "\u2022 Pillar 2: Scoped Tools (least privilege allowlists & Path.is_relative_to() sandboxing)", "\u2022 Pillar 3: Deterministic Hooks (PascalCase PreToolUse & PostToolUse AST / secret guards)", "\u2022 Pillar 4: Token Budgeting (20/20/50/10 budget allocation & head/tail log compaction)", "\u2022 Pillar 5: Structured Tracing (events.jsonl append-only immutable audit trail)"]}, {"number": 12, "raw_lines": ["Pillar 1: Memory Files", "CLAUDE.md vs AGENTS.md", "\u2022 CLAUDE.md: Claude Code standing brief", "\u2022 AGENTS.md: cross-tool standard", "\u2022 Same rules, two filenames", "\u2022 Advanced Memory Research: https://kenhuangus.github.io/agent-memory-harness/presentation/#1"]}, {"number": 13, "raw_lines": ["Pillar 2: Scoped Tools", "Least Privilege", "\u2022 Allow only needed tools", "\u2022 Keep writes inside the workspace", "\u2022 Block path traversal"]}, {"number": 14, "raw_lines": ["Pillar 3: Hooks & The 31-Event Lifecycle Map in Claude Code", "Deterministic Guardrails Across 6 Interception Categories", "\u2022 31 Lifecycle Hooks: Claude Code provides 31 deterministic PascalCase lifecycle events configured in .claude/settings.json, giving exact programmatic control over every agent turn, shell command, worktree, and memory compaction.", "\u2022 1. Session & Turn (7 hooks): SessionStart, Setup (CI/script flags), UserPromptSubmit, UserPromptExpansion, Stop, StopFailure, SessionEnd (manages environment initialization & turn teardown).", "\u2022 2. Tool & Execution Loop (6 hooks): PreToolUse (security blocker; exit code 2 blocks execution), PermissionRequest, PermissionDenied, PostToolUse (AST parsing & secret filtering), PostToolUseFailure, PostToolBatch.", "\u2022 3. Subagent & Team Orchestration (5 hooks): SubagentStart, SubagentStop (quality gates), TeammateIdle, TaskCreated, TaskCompleted (enforces 'Definition of Done' checks before accepting work).", "\u2022 4. Environment, Config & Worktrees (7 hooks): InstructionsLoaded (CLAUDE.md/AGENTS.md), ConfigChange, CwdChanged, DirectoryAdded, FileChanged, WorktreeCreate, WorktreeRemove (ephemeral git worktree isolation).", "\u2022 5. Context Compaction (2 hooks): PreCompact (intercepts token pressure), PostCompact (re-injects critical project rules after memory compression).", "\u2022 6. MCP & System Interaction (4 hooks): Notification (Slack/desktop alerts), MessageDisplay, Elicitation, ElicitationResult (sanitizes user response before sending to MCP servers)."]}, {"number": 15, "raw_lines": ["Pillars 4 & 5: Budget & Tracing", "Context Allocation & Immutable Audit Logs", "\u2022 Pillar 4: 20/20/50/10 Context Budget (ContextTokenBudgeter in core_harness_stack.py):", "  \u2022 20% (25.6k tokens) Memory: Standing rules from CLAUDE.md & AGENTS.md", "  \u2022 20% (25.6k tokens) Spec: Immutable scope & acceptance criteria in SPEC.md", "  \u2022 50% (64.0k tokens) Workspace: Active source files, tool execution & file diffs", "  \u2022 10% (12.8k tokens) Output Buffer: Reserved headroom for model generation", "\u2022 Head/Tail Context Compaction: Retains first 5 & last 15 lines/turns of conversation history and tool outputs, omitting noisy middle lines to preserve context budget.", "\u2022 Pillar 5: Structured events.jsonl audit trail providing deterministic evidence for every tool call and permission check.", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_02_core_harness_stack/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_02_core_harness_stack/core_harness_stack.py", "code_language": "python", "highlight_lines": [4, 5, 11, 12, 13, 19, 20], "code_block": "class CoreHarnessStack:\n    def validate_tool_permission(self, tool_name: str, target_path: str = None) -> bool:\n        # Line 3-6: Least-privilege tool allowlist\n        allowed_tools = [\"read_file\", \"write_file\", \"run_test\", \"list_dir\"]\n        if tool_name not in allowed_tools:\n            self.log_event(\"PERMISSION_DENIED\", {\"tool\": tool_name})\n            return False\n\n        # Line 9-14: Path sandboxing blocks directory traversal (../)\n        if target_path:\n            workspace = Path(self.workspace_root).resolve()\n            abs_target = Path(target_path).resolve()\n            if not abs_target.is_relative_to(workspace):\n                self.log_event(\"PATH_TRAVERSAL_BLOCKED\", {\"path\": str(abs_target)})\n                return False\n        return True\n\n    def run_post_edit_hook(self, file_path: str, code_content: str) -> bool:\n        # Line 19-21: Secret leak scanner blocks hardcoded credentials\n        if \"sk-proj-\" in code_content:\n            self.log_event(\"SECURITY_VIOLATION\", {\"file\": file_path, \"issue\": \"Secret key\"})\n            return False\n        return True", "raw_lines": ["Module 2 Code Lab: Tool Scoping, Path Sandboxing & Post-Edit Hook", "File: course_implementation/module_02_core_harness_stack/core_harness_stack.py", "\u2022 [Lines 4-5] Tool Permission Allowlist: Replaces unconstrained agent capabilities with an explicit allowed tool registry.", "\u2022 [Lines 11-13] Path Sandboxing: Uses Path.resolve().is_relative_to() to prevent directory traversal (../) and external access.", "\u2022 [Lines 19-20] Post-Edit Secret Scan: Inspects proposed code edits for hardcoded API keys (sk-proj-) before writing to disk.", "\u2022 Audit Observability: All tool requests and hook decisions are logged to events.jsonl with ISO timestamps."], "number": 16, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">CoreHarnessStack</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">validate_tool_permission</span>(self, tool_name: <span class=\"tok-typ\">str</span>, target_path: <span class=\"tok-typ\">str</span> = <span class=\"tok-kw\">None</span>) -&gt; <span class=\"tok-typ\">bool</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 3-6: Least-privilege tool allowlist</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        allowed_tools = [<span class=\"tok-str\">&quot;read_file&quot;</span>, <span class=\"tok-str\">&quot;write_file&quot;</span>, <span class=\"tok-str\">&quot;run_test&quot;</span>, <span class=\"tok-str\">&quot;list_dir&quot;</span>]</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> tool_name <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">in</span> allowed_tools:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">            self.log_event(<span class=\"tok-str\">&quot;PERMISSION_DENIED&quot;</span>, {<span class=\"tok-str\">&quot;tool&quot;</span>: tool_name})</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 9-14: Path sandboxing blocks directory traversal (../)</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> target_path:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">11</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            workspace = <span class=\"tok-typ\">Path</span>(self.workspace_root).resolve()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            abs_target = <span class=\"tok-typ\">Path</span>(target_path).resolve()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> <span class=\"tok-kw\">not</span> abs_target.is_relative_to(workspace):</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">                self.log_event(<span class=\"tok-str\">&quot;PATH_TRAVERSAL_BLOCKED&quot;</span>, {<span class=\"tok-str\">&quot;path&quot;</span>: <span class=\"tok-typ\">str</span>(abs_target)})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">                <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_post_edit_hook</span>(self, file_path: <span class=\"tok-typ\">str</span>, code_content: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">bool</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">19</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 19-21: Secret leak scanner blocks hardcoded credentials</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">20</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-str\">&quot;sk-proj-&quot;</span> <span class=\"tok-kw\">in</span> code_content:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">            self.log_event(<span class=\"tok-str\">&quot;SECURITY_VIOLATION&quot;</span>, {<span class=\"tok-str\">&quot;file&quot;</span>: file_path, <span class=\"tok-str\">&quot;issue&quot;</span>: <span class=\"tok-str\">&quot;Secret key&quot;</span>})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">22</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">23</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span></span></div>"}, {"number": 17, "raw_lines": ["MODULE 3: Spec-Driven Development", "Why Prompts Fail & Machine-Readable Specs Succeed", "\u2022 Prompts are ambiguous, under-specified, and prone to context drift over long chats.", "\u2022 Machine-Verifiable Contracts: SPEC.md defines allowed file scopes, schemas, and non-goals.", "\u2022 Hard Scope Boundaries: SpecVerifier rejects out-of-scope diffs and blocks unapproved writes.", "\u2022 Non-Goal Filtering: Blocks architectural sprawl and unrequested dependencies before code is saved.", "\u2022 Automated Verification: Verifies syntax via ast.parse() and runs pytest before shipping."]}, {"number": 18, "raw_lines": ["SPEC.md Anatomy", "Required Sections", "\u2022 1. Objective & Scope (allowed/forbidden files)", "\u2022 2. Explicit Non-Goals (no DB pool, no OAuth2)", "\u2022 3. Input/Output Schemas (token -> dict)", "\u2022 4. Acceptance Criteria (AC-01 through AC-04)"]}, {"number": 19, "raw_lines": ["Scope and Non-Goals", "Hard Boundaries", "\u2022 Allowed Files: auth_validator.py, test_auth.py", "\u2022 Forbidden Files: database.py, config/settings.py", "\u2022 Non-Goal: Rejects connect_db & OAuth2 rotation", "\u2022 Sandboxing: Bound via Path.is_relative_to()"]}, {"number": 20, "raw_lines": ["Acceptance Criteria", "Machine-Verifiable Contracts", "\u2022 AC-01: Exports validate_jwt(token: str) -> dict", "\u2022 AC-02: Returns valid=True, user_id=123 for live JWT", "\u2022 AC-03: Returns valid=False, error=EXPIRED for expired JWT", "\u2022 AC-04: Passes all automated tests in test_auth.py"]}, {"number": 21, "raw_lines": ["How Specs Are Used", "SDD Lifecycle", "\u2022 1. SpecVerifier parses markdown headings into schema", "\u2022 2. Agent generates code strictly inside declared scope", "\u2022 3. Pre-write audit rejects forbidden paths & non-goals", "\u2022 4. Post-write runs ast.parse() & real pytest suite", "\u2022 Lab demo: https://github.com/kenhuangus/packt-harness/blob/main/course_implementation/module_03_spec_driven_development/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_03_spec_driven_development/spec_driven_verifier.py", "code_language": "python", "highlight_lines": [6, 7, 10, 11, 12, 18], "code_block": "class SpecVerifier:\n    def attempt_write(self, target_file: str, code: str) -> tuple[bool, str]:\n        relative = self._normalized(target_file)\n        dest = (self.workspace / relative).resolve()\n\n        # Line 6-8: Strict scope boundary - only files listed in SPEC.md allowed\n        if relative not in self.allowed_files or relative in self.forbidden_files:\n            return False, \"SCOPE_VIOLATION\"  # Blocks database.py\n\n        # Line 10-13: Non-goals filter blocks unrequested architectural sprawl\n        lowered = code.lower()\n        if \"database\" in lowered or \"connect_db\" in lowered or \"oauth2\" in lowered:\n            return False, \"NON_GOAL_VIOLATION\"  # Blocks database connections\n\n        # Line 16-19: Syntax validation guarantees code compiles before save\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(code, encoding=\"utf-8\")\n        ast.parse(code, filename=str(dest))\n        return True, str(dest)", "raw_lines": ["Module 3 Code Lab: Spec Scope Enforcement & AST Validation", "File: course_implementation/module_03_spec_driven_development/spec_driven_verifier.py", "\u2022 [Lines 6-7] Scope Whitelist: Enforces that file writes strictly match allowed_files in SPEC.md; rejects unapproved files (e.g. database.py).", "\u2022 [Lines 10-12] Non-Goal Filtering: Scans diff content against explicit non-goals to prevent scope creep (e.g. database logic in a JWT validator).", "\u2022 [Line 18] AST Parsing Gate: Runs ast.parse() before saving to ensure zero syntactically broken code reaches the workspace."], "number": 22, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">SpecVerifier</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">attempt_write</span>(self, target_file: <span class=\"tok-typ\">str</span>, code: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        relative = self._normalized(target_file)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        dest = (self.workspace / relative).resolve()</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-com\"># Line 6-8: Strict scope boundary - only files
