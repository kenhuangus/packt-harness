<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packt Masterclass Presentation: 63 Interactive HTML Slides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0EEE6;
      --surface: #FAF9F5;
      --ink: #141413;
      --ink-muted: #6B6B63;
      --rule: #E3E0D6;
      --accent: #D97757;
      --accent-dk: #BD5D3A;
      --accent-sf: #F5E6DF;
      --font-display: ui-serif, Georgia, "Times New Roman", serif;
      --font-body: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      --font-code: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 64px;
      flex: 0 0 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 50;
      gap: 1rem;
      overflow-x: auto;
    }
    .header-left { display: flex; align-items: center; gap: 0.8rem; flex: 0 0 auto; }
    .brand-logo {
      width: 36px; height: 36px;
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      border-radius: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-weight: 650; font-size: 1rem; white-space: nowrap; }

    .controls { display: flex; align-items: center; gap: 0.55rem; flex: 0 0 auto; }
    .btn {
      background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
      padding: 0.46rem 0.82rem; border-radius: 10px; font-weight: 600; font-size: 0.82rem;
      cursor: pointer; transition: background-color 0.16s, border-color 0.16s; text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-sf); border-color: var(--accent); }
    .btn:focus-visible, .slide-select:focus-visible { outline: 2px solid var(--accent-dk); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
    .btn-primary:hover { background: var(--accent-sf); border-color: var(--accent-dk); color: var(--ink); }
    
    select.slide-select {
      background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.45rem 0.7rem; border-radius: 10px; font-family: var(--font-body);
      font-size: 0.82rem; font-weight: 600;
      max-width: 320px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide-viewport {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: clamp(0.8rem, 2vw, 1.6rem);
    }
    .slide-card {
      width: 100%; max-width: 1120px; height: 100%; max-height: 680px;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: 12px; padding: clamp(1.35rem, 3vw, 2.25rem); display: flex; flex-direction: column;
      position: relative;
    }
    .slide-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1.25rem; margin-bottom: 0.9rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.85rem;
    }
    .slide-title {
      min-width: 0; font-family: var(--font-display); font-size: clamp(1.45rem, 2.8vw, 2.05rem);
      font-weight: 650; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink);
    }
    .slide-num-badge {
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.32rem 0.78rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 750; white-space: nowrap;
    }
    .slide-body {
      --fit-scale: 1;
      --slide-body-base-size: 0.98rem;
      flex: 1; min-height: 0; overflow: hidden; padding-right: 0.35rem;
      font-size: calc(var(--slide-body-base-size) * var(--fit-scale));
      color: var(--ink-muted); line-height: 1.55;
    }
    .slide-body > svg {
      display: block; width: 100% !important; height: auto; max-width: 100%;
      max-height: min(18vh, 150px) !important;
    }

    /* Visual Hierarchy: Parent vs Sub Bullets (NO NUMBERS) */
    .main-bullets { list-style-type: none; padding-left: 0; margin-top: 0.55rem; }
    .main-bullets.dense-columns {
      column-count: 2; column-gap: clamp(1.5rem, 4vw, 3rem); column-fill: balance;
    }
    .bullet-group, .primary-bullet, .sub-bullets, .sub-bullet {
      break-inside: avoid; page-break-inside: avoid;
    }
    .primary-bullet {
      font-family: var(--font-display); font-size: 1.12em; font-weight: 650; color: var(--ink);
      margin-top: 0.9em; margin-bottom: 0.32em; display: flex; align-items: center; gap: 0.55em;
    }
    .primary-bullet::before {
      content: "◆"; color: var(--accent); font-size: 0.68rem;
    }
    .sub-bullets {
      list-style-type: none; padding-left: 1.35em; border-left: 1px solid var(--rule);
      margin-left: 0.32em; margin-bottom: 0.7em;
    }
    .sub-bullet {
      font-size: 0.96em; color: var(--ink-muted); margin-bottom: 0.38em; position: relative; padding-left: 1em;
    }
    .sub-bullet::before {
      content: "›"; position: absolute; left: 0; color: var(--accent-dk); font-weight: 800; font-size: 1.1rem; line-height: 1;
    }

    code {
      background: var(--accent-sf); border: 1px solid var(--rule);
      color: var(--ink); padding: 0.12rem 0.38rem; border-radius: 6px;
      font-family: var(--font-code); font-size: 0.86em; font-weight: 600;
      overflow-wrap: anywhere;
    }

    .grid-viewport {
      width: 100%; height: 100%; overflow-y: auto; padding: clamp(1rem, 3vw, 2rem);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1rem;
    }
    .grid-slide-card {
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: 12px; padding: 1.35rem; height: 290px; display: flex; flex-direction: column;
      cursor: pointer; transition: border-color 0.16s, background-color 0.16s;
    }
    .grid-slide-card:hover { background: var(--accent-sf); border-color: var(--accent); }
    .grid-slide-title {
      font-family: var(--font-display); font-size: 1.2rem; line-height: 1.15;
      font-weight: 650; margin-bottom: 0.6rem; color: var(--ink);
    }
    .grid-slide-body { flex: 1; overflow: hidden; font-size: 0.85rem; line-height: 1.5; color: var(--ink-muted); }

    .progress-bar { height: 3px; background: var(--rule); width: 100%; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    @media (max-width: 980px) {
      header { padding: 0 0.8rem; }
      .brand-title { display: none; }
      select.slide-select { max-width: 210px; }
    }
    @media (max-height: 760px) {
      .slide-card { padding: 1.2rem 1.5rem; }
      .primary-bullet { margin-top: 0.65rem; }
      .slide-body { --slide-body-base-size: 0.92rem; line-height: 1.45; }
    }
  </style>
</head>

  <script>
    const slidesData = [{"number": 1, "raw_lines": ["2026 MASTERCLASS: CLAUDE CODE HARNESS", "Build Reliable Claude Code Workflows with Guardrails and Tests", "Harness Engineering Masterclass: Scaffolding, Guardrails, MCP & Compound Workflows", "Masterclass Focus: Scaffolding, Guardrails, Model Context Protocol (MCP) & Compound Workflows", "Schedule: 09:00 AM - 11:30 AM  |  Production AI Coding Agent Systems Architecture", "GitHub Repository: https://github.com/kenhuangus/packt-harness", "Course Website: https://kenhuangus.github.io/packt-harness/"]}, {"number": 2, "raw_lines": ["COURSE MASTER MAP & GITHUB REPOSITORY", "09:00 AM - 11:30 AM", "PART 1: FOUNDATIONS & CONTROL (09:00 - 10:20)", "\u2022 Mod 1 (09:00-09:15): Why Harness Engineering & Failure Modes", "\u2022 Mod 2 (09:15-09:30): Core Harness Stack & 5 System Pillars", "\u2022 Mod 3 (09:30-09:50): Spec-Driven Development (SDD) & Schemas", "\u2022 Mod 4 (09:50-10:10): Guardrails, AST Checks & Deterministic Hooks", "\u2022 Mod 5 (10:10-10:20): Mid-Morning Break & Permission Gateways Q&A", "PART 2: RELIABILITY & TEAMS (10:20 - 11:30)", "\u2022 Mod 6 (10:20-10:35): Tests as Reliability Layer & TDA Loop", "\u2022 Mod 7 (10:35-10:50): Skills, Plugins & Model Context Protocol (MCP)", "\u2022 Mod 8 (10:50-11:05): Compound Engineering & Multi-Agent Swarms", "\u2022 Mod 9 (11:05-11:15): 5-Step Practical Workflow SOP Pattern", "\u2022 Mod 10 (11:15-11:30): Core Principles, Audit Checklist & GitHub Code"]}, {"number": 3, "raw_lines": ["MODULE 1  |  09:00 AM - 09:15 AM", "Why Harness Engineering", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Understand why AI model capability does not equal production reliability.", "\u2022 Examine the 98% Harness Rule in 2026 agentic systems engineering.", "\u2022 Analyze concrete failure modes: context drift, infinite loops, & unverified edits.", "\u2022 Code Implementation: course_implementation/module_01_why_harness_engineering/harness_vs_model_demo.py"]}, {"number": 4, "raw_lines": ["Speed Without Structure Creates Risk: Harness Thesis", "The Un-Harnessed Agent Problem", "\u2022 AI coding agents move fast, but raw model capability without scaffolding creates risk.", "\u2022 Symptom: Impressive single-turn generation, followed by context amnesia & unverified edits.", "\u2022 Risk: Infinite execution loops, path traversal exploits, and broken builds.", "The Deterministic Harness Solution", "\u2022 The difference between a useful coding agent and an unreliable one isn't the model alone \u2014 it's the harness around it.", "\u2022 Harness engineering builds surrounding systems that make agent behavior predictable, testable, and constrained.", "\u2022 Optimizes for trust, correctness, and production readiness rather than raw speed."]}, {"number": 5, "raw_lines": ["Model vs System Harness: The 2026 Paradigm", "The Model (Probabilistic Reasoner)", "\u2022 Generates code proposals based on next-token probability.", "\u2022 Susceptible to hallucinations, context amnesia, and command retries.", "\u2022 Requires external scaffolding to verify logic.", "The Harness (Deterministic Scaffolding)", "\u2022 Enforces execution boundaries, AST linting, and path sandboxing.", "\u2022 Intercepts infinite retry loops automatically.", "\u2022 Provides standardized LLM client interface for enterprise model providers."]}, {"number": 6, "raw_lines": ["Failure Mode 1: Context Decay & Amnesia", "Symptoms of Context Failure", "\u2022 Agent forgets initial constraints after 8+ conversation turns.", "\u2022 Mutates unrelated files or reverses prior architecture decisions.", "\u2022 Mitigation: Persistent memory files (CLAUDE.md / AGENTS.md)."]}, {"number": 7, "raw_lines": ["Failure Mode 2: Infinite Execution Loops", "Symptoms of Execution Traps", "\u2022 Agent retries failing compiler command endlessly with minor tweaks.", "\u2022 Burns tokens without making architectural progress.", "\u2022 Mitigation: Harness loop detector in harness_vs_model_demo.py."]}, {"number": 8, "raw_lines": ["Failure Mode 3: Unsanitized Mutations & Bad Tools", "Symptoms of Dangerous Tool Actions", "\u2022 Agent attempts rm -rf / or unauthorized shell commands.", "\u2022 Overwrites production configuration files or drops database tables.", "\u2022 Mitigation: Pre-action regex shell interceptors & path isolation."]}, {"number": 9, "raw_lines": ["MODULE 2  |  09:15 AM - 09:30 AM", "Core Harness Stack & Architecture", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Deconstruct the 5 core pillars of a production AI coding harness.", "\u2022 Implement persistent memory standards (CLAUDE.md vs AGENTS.md).", "\u2022 Build least-privilege permission models and pre/post hooks.", "\u2022 Code Implementation: course_implementation/module_02_core_harness_stack/core_harness_stack.py"]}, {"number": 10, "raw_lines": ["System Architecture: The 5 Harness Pillars", "Instructions & Repo Conventions", "\u2022 CLAUDE.md / AGENTS.md specifying architecture & rules.", "\u2022 Cascading lookup and symlink interoperability.", "Scoped Tools & Permissions", "\u2022 Least-privilege tool execution model.", "\u2022 Path sandboxing blocking path traversal exploits.", "Hooks & Policy Engine", "\u2022 Pre-action security checks.", "\u2022 Post-action AST linting and secret scanning.", "Testing & Tracing", "\u2022 Automated pytest runner feeding tracebacks back.", "\u2022 JSONL audit event logging for full observability."]}, {"number": 11, "raw_lines": ["Pillar 1: Memory Files (CLAUDE.md vs AGENTS.md)", "CLAUDE.md (Anthropic Ecosystem)", "\u2022 Dedicated standing brief for Claude Code agent sessions.", "\u2022 Supports cascading subdirectory discovery.", "AGENTS.md (Universal Open Standard)", "\u2022 Cross-tool standard for Cursor, Copilot, and Aider.", "\u2022 Symlink pattern: ln -s AGENTS.md CLAUDE.md"]}, {"number": 12, "raw_lines": ["Pillar 2: Scoped Tool & Permission Models", "Principle of Least Privilege Execution", "\u2022 Grant minimal required tools (read_file, write_file, run_test).", "\u2022 Validate target path resides within workspace root.", "\u2022 Codebase: core_harness_stack.py validate_tool_permission()"]}, {"number": 13, "raw_lines": ["Pillar 3: Deterministic Hooks & Policy Engine", "Pre-Execution & Post-Execution Interceptors", "\u2022 Pre-Hooks: Inspect tool call arguments before execution.", "\u2022 Post-Hooks: Trigger AST static analysis and secret scanners on edits."]}, {"number": 14, "raw_lines": ["Pillars 4 & 5: Context Token Budgeting & Tracing", "Context Window Compacting & Budgeting", "\u2022 Allocate token budget: 20% Memory, 20% Spec, 50% Edit, 10% Output.", "\u2022 Truncate long compiler outputs while retaining core traceback.", "JSONL Observability & Audit Tracing", "\u2022 Log structured JSON entries for every tool call and error.", "\u2022 Audit trail logged to events.jsonl for complete telemetry."]}, {"number": 15, "raw_lines": ["MODULE 3  |  09:30 AM - 09:50 AM", "Spec-Driven Development (SDD)", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Master Spec-Driven Development to eliminate prompt ambiguity.", "\u2022 Draft machine-verifiable acceptance criteria and scope boundaries.", "\u2022 Implement upfront spec verification and anti-hallucination checks.", "\u2022 Code Implementation: course_implementation/module_03_spec_driven_development/spec_driven_verifier.py"]}, {"number": 16, "raw_lines": ["Why Prompts Fail & Specs Succeed", "The Flaws of Natural Language Prompts", "\u2022 Prompts are ambiguous, subjective, and context-dependent.", "\u2022 Lead to feature creep and unrequested refactoring.", "The Power of Executable Specifications", "\u2022 Defines clear contracts, allowed files, and non-goals.", "\u2022 Codebase: SPEC.md & spec_driven_verifier.py"]}, {"number": 17, "raw_lines": ["Anatomy of a Production SPEC.md", "Required SPEC.md Structure", "\u2022 Executive Summary & Problem Context", "\u2022 Allowed Modification Scope (Explicit file list)", "\u2022 Explicit Non-Goals (Forbidden actions)", "\u2022 Input/Output Data Schemas (JSON/TypeScript)", "\u2022 Machine-Verifiable Acceptance Criteria"]}, {"number": 18, "raw_lines": ["Defining Scope Boundaries & Non-Goals", "Hard Boundaries to Prevent Scope Creep", "\u2022 Coding agents tend to refactor adjacent files needlessly.", "\u2022 SPEC.md lists explicitly allowed files (e.g. auth_validator.py).", "\u2022 Verifier rejects edits to database.py or config files."]}, {"number": 19, "raw_lines": ["Drafting Machine-Verifiable Acceptance Criteria", "Vague vs Executable Criteria", "\u2022 Vague: Make the API fast and handle errors gracefully.", "\u2022 Executable: validate_jwt(token) returns {\"valid\": True} for valid tokens.", "\u2022 Executable: 100% test coverage in tests/test_auth.py."]}, {"number": 20, "raw_lines": ["How Claude Code Processes Specs", "Agent Execution Lifecycle under SDD", "\u2022 Agent reads SPEC.md at session initialization.", "\u2022 Agent generates implementation plan matching SPEC criteria.", "\u2022 Spec verifier audits diff against allowed scope prior to merge."]}, {"number": 21, "raw_lines": ["Spec Verification & Anti-Hallucination Checks", "Upfront Consistency Verification", "\u2022 Run spec validation pass prior to code generation.", "\u2022 Ensure proposed diff satisfies non-goals and schema constraints."]}, {"number": 22, "raw_lines": ["MODULE 4  |  09:50 AM - 10:10 AM", "Guardrails and Deterministic Hooks", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Enforce 4-layer defense-in-depth security boundaries.", "\u2022 Build pre-action shell interceptors and post-action AST linters.", "\u2022 Implement path isolation sandboxing and secret key scanning.", "\u2022 Code Implementation: course_implementation/module_04_guardrails_and_hooks/guardrails_engine.py"]}, {"number": 23, "raw_lines": ["The 4-Layer Control Architecture", "Layer 1: System Rules (Prompt)", "\u2022 Soft guidelines defined in CLAUDE.md / AGENTS.md.", "Layer 2: Tool Schemas (JSON Schema)", "\u2022 Strict argument type & payload shape enforcement.", "Layer 3: Interceptors & Hooks (Process)", "\u2022 Pre-action regex filters & post-action AST static analysis.", "Layer 4: OS Sandboxing (System)", "\u2022 Path traversal blocks & workspace root chroot isolation."]}, {"number": 24, "raw_lines": ["Claude Code Native Hooks & Shell Interception", "Hook Events (Exact PascalCase Names)", "\u2022 Lifecycle: SessionStart, Setup, UserPromptSubmit, UserPromptExpansion, MessageDisplay, Stop, StopFailure, SessionEnd.", "\u2022 Tools: PreToolUse, PermissionRequest, PermissionDenied, PostToolUse, PostToolUseFailure, PostToolBatch.", "\u2022 Agents/tasks: SubagentStart, SubagentStop, TaskCreated, TaskCompleted, TeammateIdle.", "\u2022 State/context: Notification, InstructionsLoaded, ConfigChange, CwdChanged, FileChanged, WorktreeCreate, WorktreeRemove, PreCompact, PostCompact, Elicitation, ElicitationResult.", "settings.json Matcher Shape", "\u2022 {\"hooks\":{\"PreToolUse\":[{\"matcher\":\"Bash\",\"hooks\":[{\"type\":\"command\",\"command\":\"$CLAUDE_PROJECT_DIR/.claude/hooks/guard.py\",\"timeout\":10}]}]}}", "\u2022 matcher targets tool names; use Edit|Write for alternation and * (or omit it) to match all."]}, {"number": 25, "raw_lines": ["Post-Action Checks: AST Parsers & Linters", "AST Static Analysis & Secret Scanning", "\u2022 Runs automatically whenever agent writes or updates a file.", "\u2022 Executes ast.parse() to catch syntax & structural errors.", "\u2022 Scans for hardcoded secret API keys (sk-proj...)."]}, {"number": 26, "raw_lines": ["Filesystem Sandboxing & Path Isolation", "Workspace Boundary Enforcement", "\u2022 Bind agent file operations strictly to project working directory.", "\u2022 Block path traversal exploits (../../etc/passwd or C:\\Windows)."]}, {"number": 27, "raw_lines": ["Admin Escalation & Claude Code Permissions", "Risk Tiers Mapped to Real Permission Modes", "\u2022 Lowest mutation risk: plan is read-only exploration.", "\u2022 Low risk: default runs reads and asks before other tools; add narrow allow rules for trusted reads.", "\u2022 Reviewed edits: acceptEdits allows working-directory file edits and common filesystem commands; keep risky Bash actions in ask.", "\u2022 Higher autonomy: auto routes actions through background safety checks; it is a research preview, not a substitute for review.", "\u2022 Locked automation: dontAsk runs only pre-approved actions and denies anything that would prompt.", "\u2022 Critical escape hatch: bypassPermissions skips the permission layer; use only inside an isolated container or VM.", "settings.json Rules", "\u2022 {\"permissions\":{\"defaultMode\":\"default\",\"allow\":[\"Read\",\"Grep\"],\"ask\":[\"Bash(git push *)\"],\"deny\":[\"Read(./.env)\"]}}", "\u2022 Rules resolve deny \u2192 ask \u2192 allow; first matching rule wins."]}, {"number": 28, "raw_lines": ["Evaluation Harnesses: Behavior, Not Just Test Outcomes", "Reproducible Agent-Control Evaluation", "\u2022 Replay fixed tasks from known repository states with explicit acceptance tests.", "\u2022 Score test results plus scope adherence, denied tool calls, path boundaries, retry budgets, hook decisions, and audit completeness.", "\u2022 Keep the evaluator independent from the agent and turn every discovered failure into a regression case."]}, {"number": 29, "raw_lines": ["Production Safety & Audit Matrix", "Verification Checklist", "\u2022 [PASS] Are all shell commands logged to audit JSONL with timestamps?", "\u2022 [PASS] Is secret scanning enforced through PostToolUse or FileChanged hooks?", "\u2022 [PASS] Is path traversal sandboxing active for all file write tools?"]}, {"number": 30, "raw_lines": ["MODULE 5  |  10:10 AM - 10:20 AM", "Mid-Morning Break & Permission Gateways", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Take a 10-minute break to refresh.", "\u2022 Participate in open Q&A on Session 1: Harness Stack, SDD & Guardrails.", "\u2022 Review Risk-Tiered Permission Gateway implementation.", "\u2022 Code Implementation: course_implementation/module_05_break_and_qna/permission_escalation_gateway.py"]}, {"number": 31, "raw_lines": ["Open Q&A & Group Discussion", "Discussion Prompts", "\u2022 How are you currently managing agent permissions in your organization?", "\u2022 What failure modes have caused the most friction in your workflows?", "\u2022 How can spec-driven development accelerate your team velocity?"]}, {"number": 32, "raw_lines": ["MODULE 6  |  10:20 AM - 10:35 AM", "Tests as Reliability Layer", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Architect Test-Driven Agent (TDA) execution loops.", "\u2022 Leverage multi-tier testing (Unit, Integration, E2E) for validation.", "\u2022 Extract automated tracebacks and register anti-regression tests.", "\u2022 Code Implementation: course_implementation/module_06_tests_as_reliability_layer/tda_reliability_pipeline.py"]}, {"number": 33, "raw_lines": ["Test-Driven Agent (TDA) Loop Architecture", "The TDA Execution Loop", "\u2022 Write/Identify failing unit test based on SPEC.md.", "\u2022 Agent generates implementation code to satisfy test.", "\u2022 Run test runner; extract traceback on failure.", "\u2022 Feed traceback back into agent repair prompt."]}, {"number": 34, "raw_lines": ["Multi-Tier Testing for Coding Agents", "Testing Hierarchy", "\u2022 Unit Tests: Fast isolation tests verifying individual functions.", "\u2022 Integration Tests: Verifies multi-module interactions & APIs.", "\u2022 E2E Tests: Full system workflow verification."]}, {"number": 35, "raw_lines": ["Automated Error Traceback Feedback Loops", "Zero-Touch Error Capture", "\u2022 Eliminates manual copy-pasting of compiler/test errors by developer.", "\u2022 Harness captures pytest/jest stdout and stderr automatically.", "\u2022 Passes formatted traceback directly into LLM repair prompt."]}, {"number": 36, "raw_lines": ["Turning Agent Failures into Permanent Tests", "Anti-Regression Safeguards", "\u2022 Every agent hallucination or bug must yield a new regression test.", "\u2022 Add test case to project regression test suite permanently.", "\u2022 Codebase: tda_reliability_pipeline.py register_anti_regression_test()"]}, {"number": 37, "raw_lines": ["Test Reliability Scorecard & Metrics", "Key Performance Indicators (KPIs)", "\u2022 First-Pass Pass Rate: % of agent edits passing tests on turn 1.", "\u2022 Mean Iterations to Repair: Avg attempts to fix failing test (< 3).", "\u2022 Regression Rate: % of edits breaking existing tests."]}, {"number": 38, "raw_lines": ["MODULE 7  |  10:35 AM - 10:50 AM", "Skills, Plugins, and MCP Tools", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Master the Agent Skills open standard (SKILL.md).", "\u2022 Package skills, agents, hooks, MCP/LSP servers, and monitors into modular plugins.", "\u2022 Implement Model Context Protocol (MCP) servers over stdio and Streamable HTTP.", "\u2022 Code Implementation: course_implementation/module_07_skills_plugins_mcp/mcp_server_demo.py & mcp_client_runner.py"]}, {"number": 39, "raw_lines": ["Agent Skills Open Standard (SKILL.md)", "Folder-Based Skill Encapsulation", "\u2022 Self-contained folder containing SKILL.md and reference assets.", "\u2022 YAML frontmatter fields: name, description, allowed-tools, disable-model-invocation, context, agent, and model.", "\u2022 There is no triggers field: description drives discovery and must say what the skill does and when to use it.", "\u2022 Encapsulates domain expertise and repeatable workflows."]}, {"number": 40, "raw_lines": ["Structuring Skill Instructions & Resources", "Skill Directory Anatomy", "\u2022 SKILL.md: Frontmatter metadata + operational instructions.", "\u2022 references/: Deep documentation, schema specs, and design rules.", "\u2022 scripts/: Executable helper scripts and automation tools."]}, {"number": 41, "raw_lines": ["Plugin Bundles: Packaging Capabilities", "Deployable Extension Packages", "\u2022 Bundles skills, agents, hooks, MCP servers, LSP servers, and monitors.", "\u2022 Manifest path: .claude-plugin/plugin.json (name is required; metadata can include description, version, author, and dependencies).", "\u2022 Distribute through a marketplace.json catalog or load a plugin in place from a skills directory."]}, {"number": 42, "raw_lines": ["Model Context Protocol (MCP) Foundation", "Open Standard by Anthropic", "\u2022 Open standard created by Anthropic for AI-to-system connectivity.", "\u2022 MCP protocol revisions are dated YYYY-MM-DD; there is no MCP protocol version \"2.0\".", "\u2022 JSON-RPC 2.0 is the message framing, not the MCP protocol revision.", "\u2022 The Python mcp SDK package installed here is 2.0.0; its package version is separate.", "\u2022 Exposes Tools, Resources, and Prompts to LLMs."]}, {"number": 43, "raw_lines": ["MCP Transports: stdio vs Streamable HTTP", "Transport Layer Comparison", "\u2022 stdio: current transport for local subprocess servers and CLI integrations.", "\u2022 Streamable HTTP: current remote transport since MCP revision 2025-03-26.", "\u2022 HTTP+SSE is the deprecated predecessor, not the current remote choice."]}, {"number": 44, "raw_lines": ["MCP Python SDK 2.x vs 1.x", "Version-Sensitive Server Class; Shared Authoring Shape", "\u2022 SDK 2.x (installed mcp 2.0.0): from mcp.server.mcpserver import MCPServer", "\u2022 SDK 2.x: mcp = MCPServer(\"harness-tools\")", "\u2022 SDK 1.x: from mcp.server.fastmcp import FastMCP; mcp = FastMCP(\"harness-tools\")", "\u2022 Same in both: @mcp.tool() and @mcp.resource() decorators.", "\u2022 Same in both: mcp.run(transport=\"stdio\"|\"streamable-http\"|\"sse\"); SSE is legacy.", "\u2022 Codebase: mcp_server_demo.py & mcp_client_runner.py"]}, {"number": 45, "raw_lines": ["MCP Governance & Security Controls", "Enterprise Governance", "\u2022 OAuth2 & API Key authentication for remote MCP servers.", "\u2022 Granular tool-level permission gating (read vs write actions)."]}, {"number": 46, "raw_lines": ["MODULE 8  |  10:50 AM - 11:05 AM", "Compound Engineering & Agent Teams", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Design multi-agent architectures for complex software projects.", "\u2022 Implement specialized agent roles: Planner, Implementer, & Reviewer.", "\u2022 Isolate agent workspaces using Git Worktrees.", "\u2022 Code Implementation: course_implementation/module_08_compound_engineering/multi_agent_team_simulator.py"]}, {"number": 47, "raw_lines": ["Multi-Agent Workflows vs Single Agents", "Cognitive Specialization", "\u2022 Single agents suffer cognitive overload as file count grows.", "\u2022 Context window bloat reduces reasoning accuracy.", "\u2022 Multi-agent teams partition responsibilities cleanly."]}, {"number": 48, "raw_lines": ["Role Specialization: Planner Agent", "Architect & Requirement Analyst", "\u2022 Read-only access to codebase; analyzes SPEC.md requirements.", "\u2022 Drafts high-level architecture & file modification plan."]}, {"number": 49, "raw_lines": ["Role Specialization: Implementer Agent", "Constrained Coder Agent", "\u2022 Receives focused subtask assignment from Planner.", "\u2022 Executes file edits within strict workspace boundary or Git Worktree."]}, {"number": 50, "raw_lines": ["Role Specialization: Reviewer Agent", "Independent Quality Auditor", "\u2022 Independent agent inspecting Implementer output.", "\u2022 Runs static analysis, AST linters, and secret scanners."]}, {"number": 51, "raw_lines": ["Subagent Workspace Isolation & Worktrees", "First-Class Worktree Isolation", "\u2022 Define project agents in .claude/agents/<name>.md or personal agents in ~/.claude/agents/<name>.md.", "\u2022 Set isolation: worktree in the agent frontmatter.", "\u2022 Claude Code gives that subagent its own git worktree, separating edits from the parent workspace."]}, {"number": 52, "raw_lines": ["Subagent Context Windows & Agent Tool", "Focused Context and Delegation", "\u2022 Each subagent gets its own context window and receives the agent file body as its system prompt.", "\u2022 Pass only the focused sub-spec and required evidence to the Implementer.", "\u2022 The Task tool was renamed Agent in Claude Code v2.1.63; Task(...) remains an alias.", "\u2022 Codebase: multi_agent_team_simulator.py"]}, {"number": 53, "raw_lines": ["Building a Recursive Self-Improvement Loop", "Telemetry-Driven Learning", "\u2022 Collect execution logs, tracebacks, and developer edits in telemetry.jsonl.", "\u2022 Automatically analyze recurring failure patterns.", "\u2022 Feed learnings back into CLAUDE.md / AGENTS.md rules."]}, {"number": 54, "raw_lines": ["MODULE 9  |  11:05 AM - 11:15 AM", "Practical Workflow Pattern", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Master the 5-step standard operating procedure for AI coding agents.", "\u2022 Combine Spec First, Sandboxing, Hooks, Tests, & Human Review.", "\u2022 Execute production SOP pipeline end-to-end.", "\u2022 Code Implementation: course_implementation/module_09_practical_workflow_pattern/five_step_sop_pipeline.py"]}, {"number": 55, "raw_lines": ["The 5-Step Practical Workflow Overview", "Standard Operating Procedure (SOP)", "\u2022 Spec First (Draft & validate SPEC.md)", "\u2022 Constrained Execution (Sandboxed agent runner)", "\u2022 Deterministic Checks (Pre/post hooks & AST linters)", "\u2022 Test Verification (Automated pytest suite)", "\u2022 Human Review (Developer sanity check & PR merge)"]}, {"number": 56, "raw_lines": ["Phases 1 & 2: Spec First & Constrained Exec", "Alignment & Sandboxing", "\u2022 Align human & AI on exact deliverables before writing code.", "\u2022 Run agent with minimal tool permissions & strict file scopes."]}, {"number": 57, "raw_lines": ["Phases 3 & 4: Deterministic Checks & Tests", "Automated Verification Gating", "\u2022 Automated AST parsers, linters, & security rule gates.", "\u2022 Pass unit/integration test suite; feed back any errors."]}, {"number": 58, "raw_lines": ["Phase 5: Human Review & Sanity Auditing", "Developer Final Approval", "\u2022 Developer reviews clean, pre-validated PR diff.", "\u2022 Verifies business logic alignment and edge case handling."]}, {"number": 59, "raw_lines": ["MODULE 10  |  11:15 AM - 11:30 AM", "Closing Principles & Production Audit", "KEY MODULE OBJECTIVES & GITHUB IMPLEMENTATION", "\u2022 Review the 4 core principles of Harness Engineering.", "\u2022 Evaluate your team's readiness using the Production Readiness Audit Suite.", "\u2022 Access full course implementations, multi-provider LLM client & repository.", "\u2022 Code Implementation: course_implementation/module_10_closing_and_principles/production_harness_audit.py"]}, {"number": 60, "raw_lines": ["The 4 Core Principles of Harness Engineering", "Foundational Pillars", "\u2022 Predictability Over Randomness: Standardize CLAUDE.md / AGENTS.md.", "\u2022 Reduce Ambiguity: Use executable SPEC.md instead of prompts.", "\u2022 Automate Checks: Replace human vigilance with deterministic hooks & tests.", "\u2022 Optimize for Trust: Prioritize auditability and correctness."]}, {"number": 61, "raw_lines": ["Production Readiness Audit Checklist", "Audit Criteria (100% Score)", "\u2022 [PASS] Is CLAUDE.md / AGENTS.md configured in project root?", "\u2022 [PASS] Are pre-execution hooks active for dangerous shell commands?", "\u2022 [PASS] Is automated test runner integrated into agent repair loop?", "\u2022 [PASS] Are Model Context Protocol (MCP) tool permissions scoped appropriately?", "\u2022 [PASS] Is multi-agent role division active for complex subtasks?"]}, {"number": 62, "raw_lines": ["Harness System Verification & Observability", "Production Readiness Scorecard", "\u2022 Memory Files (CLAUDE.md / AGENTS.md) configured & symlinked.", "\u2022 Path isolation sandboxing blocking unauthorized file access.", "\u2022 Pre-action regex shell interceptors & post-action AST linters active.", "\u2022 Automated pytest traceback extractor feeding into repair prompts."]}, {"number": 63, "raw_lines": ["Final Q&A, Wrap-Up & Course Links", "Course Resources & Links", "\u2022 Course Website: https://kenhuangus.github.io/packt-harness/", "\u2022 GitHub Repository: https://github.com/kenhuangus/packt-harness", "\u2022 Includes 10 Module Code Implementations, LLM Client, & Test Suite.", "\u2022 Interactive Web Dashboard: course_implementation/dashboard/index.html"]}];

er\" font-size=\"15\" font-weight=\"900\" text-anchor=\"middle\">PRODUCTION READINESS SCORECARD: 100% PASS</text>\n  <text x=\"400\" y=\"60\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" text-anchor=\"middle\">\u2713 Memory (AGENTS.md)  \u2713 Sandboxing  \u2713 PreToolUse  \u2713 TDA Loop  \u2713 MCP Governance</text>\n  <text x=\"400\" y=\"80\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"10\" text-anchor=\"middle\">Verified Harness Engineering Control &amp; Reliability Framework</text>\n</svg>", "62": "<svg viewBox=\"0 0 800 100\" style=\"width:100%; max-height:100px; margin:0.5rem 0;\">\n  <rect x=\"20\" y=\"10\" width=\"760\" height=\"80\" rx=\"12\" fill=\"#FAF9F5\" stroke=\"#F0EEE6\" stroke-width=\"2\"/>\n  <rect x=\"40\" y=\"22\" width=\"220\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#D97757\" stroke-width=\"1.5\"/>\n  <text x=\"150\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">INPUT CONTEXT</text>\n  <text x=\"150\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">Slide 62 Architecture</text>\n  <path d=\"M260 50 L330 50\" stroke=\"#BD5D3A\" stroke-width=\"2.5\" stroke-dasharray=\"4 4\"/>\n  <rect x=\"330\" y=\"22\" width=\"230\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#BD5D3A\" stroke-width=\"1.5\"/>\n  <text x=\"445\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">HARNESS SYSTEM VERIFICATION  OBSERV</text>\n  <text x=\"445\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">Harness Execution Pipeline</text>\n  <path d=\"M560 50 L630 50\" stroke=\"#D97757\" stroke-width=\"2.5\"/>\n  <rect x=\"630\" y=\"22\" width=\"130\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#D97757\" stroke-width=\"1.5\"/>\n  <text x=\"695\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">VERIFIED</text>\n  <text x=\"695\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">100% Pass Rate</text>\n</svg>", "63": "<svg viewBox=\"0 0 800 100\" style=\"width:100%; max-height:100px; margin:0.5rem 0;\">\n  <rect x=\"20\" y=\"10\" width=\"760\" height=\"80\" rx=\"12\" fill=\"#FAF9F5\" stroke=\"#F0EEE6\" stroke-width=\"2\"/>\n  <rect x=\"40\" y=\"22\" width=\"220\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#D97757\" stroke-width=\"1.5\"/>\n  <text x=\"150\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">INPUT CONTEXT</text>\n  <text x=\"150\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">Slide 63 Architecture</text>\n  <path d=\"M260 50 L330 50\" stroke=\"#BD5D3A\" stroke-width=\"2.5\" stroke-dasharray=\"4 4\"/>\n  <rect x=\"330\" y=\"22\" width=\"230\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#BD5D3A\" stroke-width=\"1.5\"/>\n  <text x=\"445\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">FINAL QA WRAPUP  COURSE LINKS</text>\n  <text x=\"445\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">Harness Execution Pipeline</text>\n  <path d=\"M560 50 L630 50\" stroke=\"#D97757\" stroke-width=\"2.5\"/>\n  <rect x=\"630\" y=\"22\" width=\"130\" height=\"56\" rx=\"8\" fill=\"#F0EEE6\" stroke=\"#D97757\" stroke-width=\"1.5\"/>\n  <text x=\"695\" y=\"45\" fill=\"#141413\" font-family=\"Inter\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\">VERIFIED</text>\n  <text x=\"695\" y=\"62\" fill=\"#6B6B63\" font-family=\"Inter\" font-size=\"9\" text-anchor=\"middle\">100% Pass Rate</text>\n</svg>"};

    let currentIdx = 0;
    let isGridMode = false;
    let fitSequence = 0;
    let resizeTimer = null;

    const DENSE_BULLET_MIN_LINES = 8;
    const FIT_MIN = 0.72;
    const FIT_STEP = 0.02;
    const FIT_MAX_ITERATIONS = 15;
    const bodyEl = document.getElementById('slide-body');

    const selectEl = document.getElementById('slide-select');
    slidesData.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = `Slide ${s.number}: ${s.raw_lines[0] || 'Slide'}`;
      selectEl.appendChild(opt);
    });

    function cleanNumbers(text) {
      // A leading clock time is not list numbering: keep "09:00 AM - 11:30 AM" intact.
      if (/^\d{1,2}:\d{2}/.test(text.trim())) return text.trim();
      text = text.replace(/^(\d+[\.\)\:]|\d+\s*&\s*\d+[\.\)\:])\s*/, '');
      text = text.replace(/^(Pillar|Layer|Step|Phase|Check)\s*\d+[\.\)\:]?\s*/i, '');
      return text.trim();
    }

    function formatTextWithCode(text) {
      const keywords = ['CLAUDE.md', 'AGENTS.md', 'SPEC.md', 'pytest', 'events.jsonl', 'telemetry.jsonl', 'rm -rf', 'write_file', 'read_file', '.claude-plugin/plugin.json', 'SKILL.md', 'mcp_client_runner.py', 'mcp_server_demo.py', 'core_harness_stack.py', 'guardrails_engine.py', 'spec_driven_verifier.py', 'tda_reliability_pipeline.py', 'multi_agent_team_simulator.py', 'five_step_sop_pipeline.py', 'production_harness_audit.py'];
      keywords.forEach(kw => {
        text = text.replaceAll(kw, `<code>${kw}</code>`);
      });
      return text;
    }

    function formatBullets(lines) {
      if (!lines || lines.length === 0) return '';
      const populatedLines = lines.filter(line => line.trim());
      const denseClass = populatedLines.length >= DENSE_BULLET_MIN_LINES ? ' dense-columns' : '';
      let html = `<ul class="main-bullets${denseClass}">`;
      let groupOpen = false;
      let subListOpen = false;

      populatedLines.forEach(line => {
        const trimmed = line.trim();
        const isSub = trimmed.startsWith('•') || trimmed.startsWith('-') || trimmed.startsWith('�');
        let cleanText = trimmed.replace(/^[•\-�]\s*/, '').trim();
        cleanText = cleanNumbers(cleanText);
        cleanText = formatTextWithCode(cleanText);

        if (!cleanText) return;

        if (isSub) {
          if (!groupOpen) {
            html += '<li class="bullet-group">';
            groupOpen = true;
          }
          if (!subListOpen) {
            html += '<ul class="sub-bullets">';
            subListOpen = true;
          }
          html += `<li class="sub-bullet">${cleanText}</li>`;
        } else {
          if (subListOpen) {
            html += '</ul>';
            subListOpen = false;
          }
          if (groupOpen) html += '</li>';
          html += `<li class="bullet-group"><div class="primary-bullet">${cleanText}</div>`;
          groupOpen = true;
        }
      });

      if (subListOpen) html += '</ul>';
      if (groupOpen) html += '</li>';
      html += '</ul>';
      return html;
    }

    function bodyOverflows() {
      return bodyEl.scrollHeight > bodyEl.clientHeight + 1 ||
             bodyEl.scrollWidth > bodyEl.clientWidth + 1;
    }

    function fitSlideBody() {
      if (isGridMode || bodyEl.clientHeight === 0) return;

      let scale = 1;
      let iterations = 0;
      bodyEl.style.setProperty('--fit-scale', '1');
      bodyEl.dataset.fitScale = '1.00';
      bodyEl.dataset.fitOverflow = 'false';

      while (bodyOverflows() && scale > FIT_MIN && iterations < FIT_MAX_ITERATIONS) {
        scale = Math.max(FIT_MIN, scale - FIT_STEP);
        bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
        bodyEl.dataset.fitScale = scale.toFixed(2);
        iterations += 1;
      }

      const stillOverflows = bodyOverflows();
      bodyEl.dataset.fitOverflow = String(stillOverflows);
      if (stillOverflows) {
        console.warn(
          `[slide-fit] Slide ${slidesData[currentIdx].number} still overflows at scale ${scale.toFixed(2)}`
        );
      }
    }

    function scheduleFit() {
      const sequence = ++fitSequence;
      const fontsReady = document.fonts && document.fonts.ready
        ? document.fonts.ready.catch(() => {})
        : Promise.resolve();

      fontsReady.then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (sequence === fitSequence) fitSlideBody();
          });
        });
      });
    }

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= slidesData.length) idx = slidesData.length - 1;
      currentIdx = idx;

      const slide = slidesData[idx];
      selectEl.value = idx;

      const title = slide.raw_lines[0] || `Slide ${slide.number}`;
      document.getElementById('slide-title').innerText = title;
      document.getElementById('slide-num-badge').innerText = `Slide ${slide.number} of ${slidesData.length}`;

      let bodyHtml = '';
      if (svgMap[slide.number]) {
        bodyHtml += svgMap[slide.number];
      }

      const restLines = slide.raw_lines.slice(1);
      if (restLines.length > 0) {
        bodyHtml += formatBullets(restLines);
      }

      bodyEl.style.setProperty('--fit-scale', '1');
      bodyEl.dataset.fitScale = '1.00';
      bodyEl.dataset.fitOverflow = 'pending';
      bodyEl.innerHTML = bodyHtml;
      bodyEl.dataset.columns = bodyEl.querySelector('.dense-columns') ? '2' : '1';
      
      const pct = ((idx + 1) / slidesData.length) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      scheduleFit();
    }

    function renderGrid() {
      const gridContainer = document.getElementById('grid-mode');
      gridContainer.innerHTML = '';
      slidesData.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-slide-card';
        card.onclick = () => { isGridMode = true; toggleMode(); renderSlide(idx); };
        
        let title = slide.raw_lines[0] || `Slide ${slide.number}`;
        let body = slide.raw_lines.slice(1, 5).join(' ');
        
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <span style="font-size:0.8rem; color:var(--ink); font-weight:800;">SLIDE ${slide.number}</span>
          </div>
          <div class="grid-slide-title">${title}</div>
          <div class="grid-slide-body">${body}...</div>
        `;
        gridContainer.appendChild(card);
      });
    }

    function prevSlide() { renderSlide(currentIdx - 1); }
    function nextSlide() { renderSlide(currentIdx + 1); }
    function goToSlide(val) { renderSlide(parseInt(val)); }

    function toggleMode() {
      isGridMode = !isGridMode;
      document.getElementById('presentation-mode').style.display = isGridMode ? 'none' : 'flex';
      document.getElementById('grid-mode').style.display = isGridMode ? 'grid' : 'none';
      document.getElementById('mode-text').innerText = isGridMode ? 'Presentation Mode' : 'Grid View';
      document.getElementById('mode-icon').innerText = isGridMode ? '📺' : '📜';
      if (isGridMode) renderGrid();
      else scheduleFit();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'm' || e.key === 'M') toggleMode();
    });
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scheduleFit, 150);
    });
    document.addEventListener('fullscreenchange', scheduleFit);

    renderSlide(0);
  </script>
