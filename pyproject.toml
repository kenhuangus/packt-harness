[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packt-harness"
version = "1.0.0"
description = "Production-Grade AI Agent Harness Engineering - 10-Module Interactive Workshop & CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ken Huang" }
]
keywords = [
    "ai-agents",
    "agent-harness",
    "claude-code",
    "model-context-protocol",
    "guardrails",
    "spec-driven-development",
    "compound-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pytest>=8.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    # The [openai] extra is required, not cosmetic: aisuite loads a provider
    # module lazily, and the course default is an OpenAI-compatible local
    # endpoint. Plain "aisuite" installs, then fails at the first call with
    # "No module named 'openai'".
    "aisuite[openai]>=0.1.0",
]

# course_implementation/dashboard/capture_dashboard.py drives a real browser.
# It is not one of the ten modules and run_all_modules.py never invokes it,
# so playwright stays out of the default install: it pulls browser binaries
# that the modules do not need.
[project.optional-dependencies]
dashboard = ["playwright>=1.40.0"]
# Only needed to switch LLM_PROVIDER=anthropic per the root README.
anthropic = ["aisuite[anthropic]>=0.1.0"]

[project.scripts]
packt-harness = "packt_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packt_harness*", "course_implementation*"]
